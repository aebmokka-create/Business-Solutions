<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dahlsens Valued Attributes</title><style>
:root{--ink:#1a1a1a;--muted:#6b7280;--paper:#f7f7f5;--line:#e2e8e2;--brand:#2d5f3f;--brand2:#e8f5ee;--orange:#e8732a;--orange2:#fff3eb;--orange3:#f5cba7;--danger:#cc3333;--shadow:0 10px 26px rgba(0,0,0,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;touch-action:manipulation}
input[type=date]{-webkit-appearance:textfield;appearance:textfield}
input[type=number]{-moz-appearance:textfield;-webkit-appearance:none;appearance:none;text-align:center}
.app{display:grid;grid-template-columns:258px 1fr;min-height:100dvh}
aside{padding:24px 15px;background:#1e3d28;color:#eef7f2;position:sticky;top:0;height:100dvh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 6px}
.logo-mark{height:36px;width:36px;background:var(--orange);border-radius:10px;color:#fff;display:grid;place-items:center;font-size:18px;font-weight:900;flex-shrink:0}
.logo-text{display:flex;flex-direction:column;line-height:1.25}
.logo-text b{font-size:14px;letter-spacing:.5px}
.logo-text span{font-size:9px;color:#9eb9ad;letter-spacing:.6px;text-transform:uppercase}
.side-subtitle{padding:4px 8px 18px;font-size:10px;color:#9eb9ad}
.nav-label{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#a8beb4;margin:8px 9px}
.nav{display:grid;gap:4px}
.nav button{background:none;color:#d0e1d8;border-radius:9px;padding:12px 10px;text-align:left;font-size:14px;width:100%;min-height:44px}
.nav button:hover,.nav button.active{background:#2d5f3f;color:#fff}
.nav .icon{display:inline-block;width:22px}
main{max-width:1500px;width:100%;margin:0 auto;padding:28px 38px 60px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.eyebrow{text-transform:uppercase;letter-spacing:1.2px;font-size:10px;color:var(--orange);font-weight:800}
.topbar h1{font-size:26px;letter-spacing:-1px;margin:5px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border-radius:9px;padding:11px 15px;font-weight:700;font-size:13px;background:#e8f0eb;color:#1e3d28;min-height:44px}
.btn.primary{background:var(--orange);color:#fff}
.btn.danger{background:#fcecea;color:var(--danger)}
.view{display:none}.view.active{display:block}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:var(--shadow)}
.stat .label{font-size:12px;color:var(--muted);font-weight:600}
.stat .num{font-size:30px;letter-spacing:-1.5px;font-weight:800;margin:8px 0 2px;color:var(--brand);word-break:break-word}
.stat .sub{font-size:11px;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);margin-bottom:16px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:15px;margin:0}
.panel-body{padding:16px 18px}
.notice{background:var(--orange2);border:1px solid var(--orange3);border-radius:9px;padding:13px;font-size:12px;color:#7a3d12;line-height:1.5}
.guide{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 16px}
.guide div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:11px;line-height:1.35}
.guide b{display:block;color:var(--brand);font-size:12px;margin-bottom:2px}
.draft{background:#fff8e6;border:1px solid #f0d9a0;border-radius:11px;padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.draft b{font-size:13px}.draft small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;padding-bottom:16px}
.search{border:1px solid var(--line);background:#fff;border-radius:8px;padding:11px;font-size:16px;min-height:44px;flex:1;min-width:160px}
.select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:11px;font-size:16px;min-height:44px}
.tag{font-size:10px;font-weight:800;color:#1e3d28;background:var(--brand2);padding:5px 8px;border-radius:20px}
.textbtn{color:var(--orange);background:none;font-weight:800;font-size:12px;min-height:44px;padding:0 2px}
.form-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;color:#4c5c54}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:11px;background:#fff;outline-color:var(--orange);width:100%;font-size:16px}
.field textarea{height:82px;resize:vertical}
.wide{grid-column:1/-1}
.score-summary{position:sticky;top:0;z-index:6;display:flex;gap:18px;background:var(--orange2);border:1px solid var(--orange3);padding:13px 15px;border-radius:10px;margin-bottom:14px;flex-wrap:wrap}
.score-summary>div{border-right:1px solid var(--orange3);padding-right:18px}
.score-summary>div:last-child{border:0;padding-right:0}
.score-summary small{display:block;font-size:10px;color:#7a3d12;text-transform:uppercase;letter-spacing:.7px;font-weight:800}
.score-summary b{font-size:21px;letter-spacing:-1px;color:var(--brand)}
.dim{font-size:12px;color:#7a3d12;font-weight:600}
.group-head{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--orange);border-bottom:2px solid var(--orange2);padding:18px 0 7px;margin-bottom:2px;grid-column:1/-1;display:flex;justify-content:space-between;gap:10px}
.score-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 26px}
.score-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #f1f4f1;min-height:48px}
.score-row label{font-size:13px;line-height:1.25}
.score-stepper{display:flex;align-items:center;gap:5px}
.stepper-btn{width:40px;height:40px;border-radius:9px;background:var(--orange2);color:var(--orange);font-size:20px;font-weight:800;border:1px solid var(--orange3);flex-shrink:0}
.stepper-btn:active{background:var(--orange3)}
.score-input{width:52px;text-align:center;padding:8px 2px;font-weight:800;font-size:16px;border:1px solid var(--line);border-radius:7px;background:#fff}
.hl{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hl h4{margin:0 0 8px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.hl ol{margin:0;padding-left:18px;font-size:13px;line-height:1.7}
.hl li span{float:right;font-weight:800;color:var(--brand)}
.hl .none{font-size:12px;color:var(--muted)}
.recommend{display:flex;gap:8px;flex-wrap:wrap}
.recommend label{border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:12px;cursor:pointer}
.recommend input{accent-color:var(--orange)}
.compare-picks{display:flex;gap:7px;flex-wrap:wrap}
.pick{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;font-size:12px;min-height:44px}
.pick.selected{border-color:var(--orange);background:var(--orange2);color:var(--orange);font-weight:800}
.compare-table{overflow:auto;-webkit-overflow-scrolling:touch}
.compare-table table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
.compare-table th,.compare-table td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;background:#fff}
.compare-table th{color:var(--muted);font-size:11px;position:sticky;top:0;z-index:3}
.compare-table th:first-child,.compare-table td:first-child{text-align:left;min-width:170px;position:sticky;left:0;z-index:2;box-shadow:1px 0 0 var(--line)}
.compare-table th:first-child{z-index:4}
.compare-table tr.grp td{background:var(--brand2);font-weight:800;color:#1e3d28;font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.win{color:var(--brand);font-weight:800;background:#eff8f1!important}
.empty{padding:46px 15px;text-align:center;color:var(--muted);border:1px dashed var(--orange3);border-radius:12px;grid-column:1/-1}
.empty b{display:block;font-size:15px;color:var(--ink);margin-bottom:5px}
.project-hero{display:grid;place-items:center;text-align:center;padding:34px 20px;background:linear-gradient(135deg,#f7f7f5,#fff3eb);border:1px solid var(--orange3);border-radius:16px;margin-bottom:18px}
.project-hero-inner{max-width:590px;width:100%}
.project-hero h2{font-size:34px;letter-spacing:-1.6px;margin:6px 0;color:var(--brand)}
.project-hero .sub{font-size:13px;color:#6c7d74;margin:0 0 22px}
.project-box{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.project-box input{width:min(330px,100%);padding:13px;border:1px solid var(--orange3);border-radius:8px;background:#fff;font-size:16px}
.project-history{margin-top:14px;font-size:12px;color:#617168}
.project-history select{margin-left:6px;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff;max-width:220px;font-size:16px}
.project-credit{font-size:10px;color:#91a198;margin:24px 0 0}
.directory-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.directory-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:13px;background:#fff}
.directory-name{flex:1;min-width:0}
.directory-row b{display:block;font-size:14px}
.directory-row small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.directory-score{font-weight:800;font-size:16px;white-space:nowrap;color:var(--brand)}
.directory-score small{font-weight:500;color:var(--muted)}
.large-avatar{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#e8732a,#2d5f3f);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;flex-shrink:0}
.bar{height:5px;background:#eef1ee;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--orange)}
.mob-nav{display:none}
@media(max-width:1024px){
.app{grid-template-columns:1fr}
aside{height:auto;position:relative;padding:14px}
.nav-label,.side-subtitle{display:none}
.nav{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
.nav button{white-space:nowrap;flex-shrink:0;width:auto}
main{padding:22px 16px 40px}
.stat-grid{grid-template-columns:1fr 1fr}
.directory-list{grid-template-columns:1fr}
.score-grid{grid-template-columns:1fr}
.guide{grid-template-columns:1fr 1fr}}
@media(max-width:600px){
aside{display:none}
.mob-nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:99;padding-bottom:env(safe-area-inset-bottom)}
.mob-nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 2px;background:none;color:var(--muted);font-size:10px;font-weight:700;min-height:56px}
.mob-nav button.active{color:var(--orange)}
.mob-nav i{font-style:normal;font-size:19px}
main{padding:16px 13px 92px}
.topbar h1{font-size:21px}
.actions{width:100%}
.actions .btn{flex:1;text-align:center}
.stat-grid{gap:10px}
.stat{padding:14px}
.stat .num{font-size:23px}
.form-layout,.hl{grid-template-columns:1fr}
.score-summary{gap:10px;padding:11px}
.score-summary>div{padding-right:10px}
.score-summary b{font-size:18px}
.project-hero{padding:26px 16px}
.project-hero h2{font-size:25px}
.project-box{flex-direction:column}
.directory-row{flex-wrap:wrap}}
@media print{
aside,.mob-nav,.topbar,.toolbar,.actions,.draft,.no-print{display:none!important}
.app{display:block}
.view{display:none!important}.view.active{display:block!important}
main{padding:0;max-width:none}
.panel{box-shadow:none;break-inside:avoid}
.score-summary{position:static}
.score-grid,.guide{grid-template-columns:1fr 1fr}}
</style>
</head><body>
<div class="app">
<aside>
<div class="logo"><span class="logo-mark">D</span><span class="logo-text"><b>DAHLSENS</b><span>Valued Attributes</span></span></div>
<div class="side-subtitle">Employee Evaluation Scorecard</div>
<div class="nav-label">WORKSPACE</div>
<nav class="nav">
<button class="active" data-view="dashboard"><span class="icon">◫</span> Dahlsens Attributes</button>
<button data-view="talent"><span class="icon">♙</span> Employee directory</button>
<button data-view="scorecard"><span class="icon">✦</span> New evaluation</button>
<button data-view="compare"><span class="icon">◈</span> Compare employees</button>
</nav>
</aside>
<nav class="mob-nav">
<button class="active" data-view="dashboard"><i>◫</i>Overview</button>
<button data-view="talent"><i>♙</i>Directory</button>
<button data-view="scorecard"><i>✦</i>Evaluate</button>
<button data-view="compare"><i>◈</i>Compare</button>
</nav>
<main>
<header class="topbar">
<div><div class="eyebrow" id="crumb">Employee Evaluation Scorecard</div><h1 id="pageTitle">Dahlsens Valued Attributes</h1></div>
<div class="actions">
<button class="btn no-print" onclick="backup()">Backup</button>
<button class="btn no-print" onclick="document.getElementById('rf').click()">Restore</button>
<button class="btn no-print" onclick="exportCsv()">Export CSV</button>
<button class="btn primary" onclick="newEvaluation()">+ New evaluation</button>
</div>
</header>
<input type="file" id="rf" accept=".json" style="display:none" onchange="restore(this)">
<section id="dashboard" class="view active"></section>
<section id="talent" class="view"></section>
<section id="scorecard" class="view"></section>
<section id="compare" class="view"></section>
</main></div>
<script>
var GROUPS=[
{n:'Technical Knowledge',a:['Product knowledge','Building construction knowledge','Reading plans','Estimating understanding','Technical credibility']},
{n:'Sales Capability',a:['Prospecting','Needs analysis','Whole-of-House selling','Negotiation','Opportunity identification','Quote conversion','Customer retention']},
{n:'Commercial Acumen',a:['Commercial awareness','Margin discipline','Account growth','Pipeline management']},
{n:'Process & Discipline',a:['Sales reporting','Contact management','Territory management','Route planning','Time management','Follow-up discipline','Digital competency']},
{n:'Personal Attributes',a:['Accountability','Communication','Problem solving','Attention to detail','Reliability','Resilience']}];
var attrs=[],GI=[];
(function(){for(var g=0;g<GROUPS.length;g++)for(var i=0;i<GROUPS[g].a.length;i++){attrs.push(GROUPS[g].a[i]);GI.push(g);}})();
var SCALE=[['10 – 9','Exceptional. A benchmark for others.'],['8 – 7','Consistently strong. Meets the standard.'],['6 – 5','Inconsistent. Capable but variable.'],['4 – 1','Significant gap. Needs structured support.']];

var projectBooks={},currentProject='',people=[],editing=null,comparison=[],dirty=false,draftTimer=null;
try{projectBooks=JSON.parse(localStorage.getItem('dahlsens-projects')||'{}');currentProject=localStorage.getItem('dahlsens-current')||'';}catch(e){}
if(currentProject&&projectBooks[currentProject])people=projectBooks[currentProject];

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function cloneObj(o){return JSON.parse(JSON.stringify(o));}
function cp(n){n=Number(n);if(isNaN(n))n=0;return Math.max(0,Math.min(10,n));}
function fix(p){if(!p.scores)p.scores=[];while(p.scores.length<attrs.length)p.scores.push(0);return p;}
function pos(p){return fix(p).scores.filter(function(x){return Number(x)>0;});}
function total(p){var v=pos(p),t=0;for(var i=0;i<v.length;i++)t+=Number(v[i]);return t;}
function avg(p){var v=pos(p);return v.length?total(p)/v.length:0;}
function gavg(p,g){var s=0,c=0;for(var i=0;i<attrs.length;i++)if(GI[i]===g&&p.scores[i]>0){s+=Number(p.scores[i]);c++;}return c?s/c:0;}
function rating(a){return !a?'Not rated':a>=9?'Exceeds expectations':a>=7?'Meets expectations':a>=5?'Needs improvement':'Unsatisfactory';}
function initials(n){return String(n||'?').split(/\s+/).map(function(x){return x[0];}).filter(Boolean).slice(0,2).join('').toUpperCase();}
function uniq(k){var o={},r=[],i;for(i=0;i<people.length;i++){var v=(people[i][k]||'').trim();if(v&&!o[v]){o[v]=1;r.push(v);}}return r.sort();}
function save(){if(!currentProject)return;projectBooks[currentProject]=people;
try{localStorage.setItem('dahlsens-projects',JSON.stringify(projectBooks));localStorage.setItem('dahlsens-current',currentProject);}
catch(e){alert('Could not save - storage may be full or blocked.');}}

/* ---- draft autosave ---- */
function draftKey(){return 'dahlsens-draft';}
function readForm(){
if(!editing)return null;var p=cloneObj(editing),i;
var K=['name','station','role','type','market','assessor','date','strengths','weaknesses','plan'];
for(i=0;i<K.length;i++){var e=document.getElementsByName(K[i])[0];if(e)p[K[i]]=e.value;}
var r=document.querySelectorAll('input[name=recommendation]');
for(i=0;i<r.length;i++)if(r[i].checked)p.recommendation=r[i].value;
p.scores=[];for(i=0;i<attrs.length;i++){var s=document.getElementById('score'+i);p.scores.push(cp(s?s.value:0));}
return p;}
function saveDraft(){if(!editing||!dirty)return;var p=readForm();if(!p)return;
try{localStorage.setItem(draftKey(),JSON.stringify({project:currentProject,when:new Date().toISOString(),rec:p}));}catch(e){}}
function clearDraft(){try{localStorage.removeItem(draftKey());}catch(e){}}
function getDraft(){try{return JSON.parse(localStorage.getItem(draftKey())||'null');}catch(e){return null;}}
function touch(){dirty=true;}
function resumeDraft(){var d=getDraft();if(!d)return;
currentProject=d.project;people=projectBooks[currentProject]?cloneObj(projectBooks[currentProject]):[];
editing=fix(d.rec);renderScorecard();dirty=true;show('scorecard');}
function discardDraft(){if(confirm('Discard the unsaved draft?')){clearDraft();renderDashboard();}}
function leaveGuard(){if(!dirty)return true;
if(confirm('You have unsaved changes. Leave without saving?')){dirty=false;clearDraft();return true;}return false;}
window.onbeforeunload=function(){if(dirty)return 'You have unsaved changes.';};
setInterval(saveDraft,4000);

function show(id){
var i,n=document.querySelectorAll('.nav button,.mob-nav button');
for(i=0;i<n.length;i++)n[i].className=(n[i].getAttribute('data-view')===id?'active':'');
var v=document.querySelectorAll('.view');
for(i=0;i<v.length;i++)v[i].className='view'+(v[i].id===id?' active':'');
var t={dashboard:'Dahlsens Valued Attributes',talent:'Employee Directory',scorecard:(editing&&editing.id)?'Edit Evaluation':'New Evaluation',compare:'Compare Employees'};
document.getElementById('pageTitle').textContent=t[id]||id;
document.getElementById('crumb').textContent=id==='scorecard'?'Evaluation workspace':'Employee Evaluation Scorecard';
if(id==='compare')renderCompare();
window.scrollTo(0,0);}
function nav(id){if(id!=='scorecard'&&!leaveGuard())return;
if(id==='scorecard'){newEvaluation();return;}show(id);}

function openProject(){var f=document.getElementById('projectName'),n=f?f.value.trim():'';
if(!n){if(f)f.focus();return;}
currentProject=n;people=projectBooks[n]?cloneObj(projectBooks[n]):[];comparison=[];editing=null;dirty=false;
save();renderAll();show('talent');}
function switchProject(s){if(!s.value)return;currentProject=s.value;
people=projectBooks[currentProject]?cloneObj(projectBooks[currentProject]):[];
comparison=[];editing=null;dirty=false;save();renderAll();show('talent');}

function renderAll(){renderDashboard();renderTalent();}

function renderDashboard(){
var i,k,g,ranked=people.slice().sort(function(a,b){return avg(b)-avg(a);});
var top=ranked[0],overall=0;
for(i=0;i<people.length;i++)overall+=avg(people[i]);
overall=people.length?overall/people.length:0;
var h='',d=getDraft();
if(d&&d.rec){h+='<div class="draft"><div><b>Unsaved draft found</b><small>'+esc(d.rec.name||'Unnamed')+' · '+esc(d.project||'')+' · '+new Date(d.when).toLocaleString()+'</small></div>';
h+='<span><button class="btn primary" onclick="resumeDraft()">Resume</button> <button class="btn" onclick="discardDraft()">Discard</button></span></div>';}
h+='<div class="project-hero"><div class="project-hero-inner">';
h+='<div class="eyebrow">Employee Evaluation Scorecard</div>';
h+='<h2>DAHLSENS VALUED ATTRIBUTES</h2>';
h+='<p class="sub">Assess, compare and develop employees with a disciplined, consistent scorecard.</p>';
h+='<div class="project-box"><input id="projectName" value="'+esc(currentProject)+'" placeholder="Project name">';
h+='<button class="btn primary" onclick="openProject()">Open project</button></div>';
h+='<div class="project-history">';
var ks=[];for(k in projectBooks)ks.push(k);ks.sort();
if(ks.length){h+='Return to: <select onchange="switchProject(this)"><option value="">Saved projects</option>';
for(i=0;i<ks.length;i++)h+='<option'+(ks[i]===currentProject?' selected':'')+'>'+esc(ks[i])+'</option>';
h+='</select>';}else{h+='Enter a project name to begin.';}
h+='</div><p class="project-credit">Created by Tony Bell for Dahlsens Management</p></div></div>';
if(currentProject){
h+='<div class="stat-grid">';
h+='<div class="stat"><div class="label">Project</div><div class="num" style="font-size:19px">'+esc(currentProject)+'</div><div class="sub">Current workspace</div></div>';
h+='<div class="stat"><div class="label">Employees assessed</div><div class="num">'+people.length+'</div><div class="sub">Profiles in this project</div></div>';
h+='<div class="stat"><div class="label">Average score</div><div class="num">'+(overall?overall.toFixed(1):'—')+'</div><div class="sub">Zero values not included</div></div>';
h+='<div class="stat"><div class="label">Top performer</div><div class="num" style="font-size:19px">'+(top?esc(top.name||'Unnamed'):'—')+'</div><div class="sub">'+(top?avg(top).toFixed(1)+' / 10':'No evaluations yet')+'</div></div>';
h+='</div>';
if(people.length){
h+='<div class="panel"><div class="panel-head"><h2>Team averages by group</h2></div><div class="panel-body">';
for(g=0;g<GROUPS.length;g++){var s=0,c=0;
for(i=0;i<people.length;i++){var x=gavg(people[i],g);if(x>0){s+=x;c++;}}
var m=c?s/c:0;
h+='<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700"><span>'+esc(GROUPS[g].n)+'</span><span style="color:var(--brand)">'+(m?m.toFixed(1):'—')+'</span></div>';
h+='<div class="bar"><i style="width:'+(m*10)+'%"></i></div></div>';}
h+='</div></div>';}}
document.getElementById('dashboard').innerHTML=h;}

function renderTalent(){
var h='<div class="panel"><div class="panel-head"><h2>'+(currentProject?'Employees in '+esc(currentProject):'Choose a project first')+'</h2>';
h+='<button class="btn primary" onclick="newEvaluation()">+ Add employee</button></div>';
h+='<div class="panel-body"><div class="toolbar">';
h+='<input class="search" id="search" oninput="filterTalent()" placeholder="Search names">';
h+='<select id="fRole" class="select" onchange="filterTalent()"><option value="">All job titles</option>'+uniq('role').map(function(x){return'<option>'+esc(x)+'</option>';}).join('')+'</select>';
h+='<select id="fReg" class="select" onchange="filterTalent()"><option value="">All regions</option>'+uniq('market').map(function(x){return'<option>'+esc(x)+'</option>';}).join('')+'</select>';
h+='<select id="fType" class="select" onchange="filterTalent()"><option value="">All types</option><option>Current Employee</option><option>Candidate</option></select>';
h+='<select id="sort" class="select" onchange="filterTalent()"><option value="name">Sort: Name</option><option value="score">Sort: Score</option><option value="recent">Sort: Recent</option></select></div>';
h+='<div id="talentCards" class="directory-list"></div></div></div>';
document.getElementById('talent').innerHTML=h;filterTalent();}

function filterTalent(){
var el=document.getElementById('talentCards');if(!el)return;
function val(id){var e=document.getElementById(id);return e?e.value:'';}
var q=val('search').toLowerCase(),fr=val('fRole'),fg=val('fReg'),ft=val('fType'),s=val('sort')||'name';
var L=people.filter(function(p){
if(fr&&p.role!==fr)return false;
if(fg&&p.market!==fg)return false;
if(ft&&p.type!==ft)return false;
return[p.name,p.station,p.role,p.market].join(' ').toLowerCase().indexOf(q)>=0;});
L.sort(function(a,b){if(s==='score')return avg(b)-avg(a);
if(s==='recent')return String(b.date||'').localeCompare(String(a.date||''));
return String(a.name||'').localeCompare(String(b.name||''));});
if(!L.length){el.innerHTML='<div class="empty"><b>'+(currentProject?'No matches':'No project selected')+'</b>'+(currentProject?'Adjust the filters or add an employee.':'Enter a project name first.')+'</div>';return;}
var h='';
for(var i=0;i<L.length;i++){var p=L[i],a=avg(p),n=pos(p).length;
h+='<article class="directory-row"><div class="large-avatar">'+esc(initials(p.name))+'</div>';
h+='<div class="directory-name"><b>'+esc(p.name||'Unnamed')+'</b><small>'+esc([p.role,p.market].filter(Boolean).join(' · ')||'No details yet')+' · '+n+'/'+attrs.length+' rated</small>';
h+='<div class="bar"><i style="width:'+(a*10)+'%"></i></div></div>';
h+='<div class="directory-score">'+(a?a.toFixed(1):'—')+'<small> / 10</small></div>';
h+='<button class="textbtn" onclick="editPerson(\''+p.id+'\')">Open →</button></article>';}
el.innerHTML=h;}
function newEvaluation(){
if(!leaveGuard())return;
if(!currentProject){show('dashboard');var f=document.getElementById('projectName');if(f)f.focus();return;}
editing={id:'',name:'',station:'',role:'',type:'',market:'',assessor:'',date:new Date().toISOString().slice(0,10),
scores:[],strengths:'',weaknesses:'',plan:'',recommendation:''};
for(var i=0;i<attrs.length;i++)editing.scores.push(0);
dirty=false;renderScorecard();show('scorecard');}

function editPerson(id){
if(!leaveGuard())return;
for(var i=0;i<people.length;i++)if(people[i].id===id){
editing=fix(cloneObj(people[i]));dirty=false;renderScorecard();show('scorecard');return;}}

function ranked(p,dir){
var r=[],i;
for(i=0;i<attrs.length;i++)if(p.scores[i]>0)r.push({n:attrs[i],v:Number(p.scores[i])});
r.sort(function(a,b){return dir==='hi'?b.v-a.v:a.v-b.v;});
return r.slice(0,5);}

function highlightsHtml(p){
var hi=ranked(p,'hi'),lo=ranked(p,'lo'),i,h='<div class="hl">';
h+='<div><h4>Top strengths</h4>';
if(hi.length){h+='<ol>';for(i=0;i<hi.length;i++)h+='<li>'+esc(hi[i].n)+'<span>'+hi[i].v+'</span></li>';h+='</ol>';}
else h+='<p class="none">Score some attributes to see this.</p>';
h+='</div><div><h4>Development priorities</h4>';
if(lo.length){h+='<ol>';for(i=0;i<lo.length;i++)h+='<li>'+esc(lo[i].n)+'<span>'+lo[i].v+'</span></li>';h+='</ol>';}
else h+='<p class="none">Score some attributes to see this.</p>';
return h+'</div></div>';}

function renderScorecard(){
var p=editing,i,v=pos(p),t=total(p),a=avg(p);
var h='<form onsubmit="savePerson(event)" oninput="touch()" onchange="touch()">';
h+='<div class="panel"><div class="panel-head"><h2>Employee details</h2><span class="tag">'+(currentProject?esc(currentProject):'No project')+'</span></div>';
h+='<div class="panel-body"><div class="form-layout">';
h+='<div class="field"><label>Full name *</label><input required name="name" value="'+esc(p.name)+'"></div>';
h+='<div class="field"><label>Employee type</label><select name="type"><option value="">Select type</option>';
h+='<option'+(p.type==='Current Employee'?' selected':'')+'>Current Employee</option>';
h+='<option'+(p.type==='Candidate'?' selected':'')+'>Candidate</option></select></div>';
h+='<div class="field"><label>Years with Dahlsens</label><input name="station" value="'+esc(p.station)+'"></div>';
h+='<div class="field"><label>Job title</label><input name="role" value="'+esc(p.role)+'"></div>';
h+='<div class="field"><label>Region</label><input name="market" value="'+esc(p.market)+'"></div>';
h+='<div class="field"><label>Assessor</label><input name="assessor" value="'+esc(p.assessor)+'"></div>';
h+='<div class="field"><label>Assessment date</label><input name="date" type="date" value="'+esc(p.date)+'"></div>';
h+='</div></div></div>';
h+='<div class="panel"><div class="panel-head"><h2>Performance scorecard</h2>';
h+='<span><button type="button" class="btn no-print" onclick="window.print()">Print</button> ';
h+='<button type="button" class="btn no-print" onclick="resetScores()">Reset to 0</button></span></div>';
h+='<div class="panel-body"><div class="notice">Enter 1-10 for applicable attributes. Leave at 0 if not applicable — it is excluded from the average.</div>';
h+='<div class="guide">';
for(i=0;i<SCALE.length;i++)h+='<div><b>'+SCALE[i][0]+'</b>'+SCALE[i][1]+'</div>';
h+='</div>';
h+='<div class="score-summary"><div><small>Total</small><b id="totalScore">'+t+' <span class="dim">/ '+(v.length*10)+'</span></b></div>';
h+='<div><small>Average</small><b id="averageScore">'+(v.length?a.toFixed(1):'—')+' <span class="dim">/ 10</span></b></div>';
h+='<div><small>Rating</small><b id="ratingScore" style="font-size:15px">'+rating(a)+'</b></div>';
h+='<div><small>Progress</small><b id="progScore" style="font-size:15px">'+v.length+' of '+attrs.length+'</b></div></div>';
h+='<div class="score-grid">';
var g=-1;
for(i=0;i<attrs.length;i++){
if(GI[i]!==g){g=GI[i];h+='<div class="group-head"><span>'+esc(GROUPS[g].n)+'</span><span id="ga'+g+'">'+(gavg(p,g)?gavg(p,g).toFixed(1):'—')+'</span></div>';}
h+='<div class="score-row"><label for="score'+i+'">'+(i+1)+'. '+esc(attrs[i])+'</label><div class="score-stepper">';
h+='<button type="button" class="stepper-btn" onclick="stepScore('+i+',-1)">−</button>';
h+='<input id="score'+i+'" class="score-input" name="score'+i+'" type="number" min="0" max="10" value="'+cp(p.scores[i])+'" oninput="updateSummary()">';
h+='<button type="button" class="stepper-btn" onclick="stepScore('+i+',1)">+</button></div></div>';}
h+='</div></div></div>';
h+='<div class="panel"><div class="panel-head"><h2>Profile highlights</h2></div><div class="panel-body" id="hlBox">'+highlightsHtml(p)+'</div></div>';
h+='<div class="panel"><div class="panel-head"><h2>Assessment notes and recommendation</h2></div><div class="panel-body"><div class="form-layout">';
h+='<div class="field"><label>Key strengths</label><textarea name="strengths">'+esc(p.strengths)+'</textarea></div>';
h+='<div class="field"><label>Development opportunities</label><textarea name="weaknesses">'+esc(p.weaknesses)+'</textarea></div>';
h+='<div class="field wide"><label>Development plan</label><textarea name="plan">'+esc(p.plan)+'</textarea></div>';
h+='<div class="field wide"><label>Recommendation</label><div class="recommend">';
var R=['Exceeds expectations','Meets expectations','Needs improvement','Unsatisfactory'];
for(i=0;i<R.length;i++)h+='<label><input type="radio" name="recommendation" value="'+R[i]+'"'+(p.recommendation===R[i]?' checked':'')+'> '+R[i]+'</label>';
h+='</div></div></div></div></div>';
h+='<div class="actions" style="justify-content:flex-end;padding-bottom:24px">';
h+='<button type="button" class="btn" onclick="cancelEdit()">Cancel</button>';
if(p.id)h+='<button type="button" class="btn danger" onclick="deletePerson(\''+p.id+'\')">Delete</button>';
h+='<button type="submit" class="btn primary">Save evaluation</button></div></form>';
document.getElementById('scorecard').innerHTML=h;}

function cancelEdit(){if(!leaveGuard())return;editing=null;show('talent');}
function stepScore(i,d){var e=document.getElementById('score'+i);if(!e)return;e.value=cp((Number(e.value)||0)+d);touch();updateSummary();}
function resetScores(){for(var i=0;i<attrs.length;i++){var e=document.getElementById('score'+i);if(e)e.value=0;}touch();updateSummary();}

function updateSummary(){
var i,g,sc=[],v=[],t=0;
for(i=0;i<attrs.length;i++){var e=document.getElementById('score'+i);var n=cp(e?e.value:0);sc.push(n);if(n>0){v.push(n);t+=n;}}
var a=v.length?t/v.length:0;
var A=document.getElementById('totalScore'),B=document.getElementById('averageScore'),
C=document.getElementById('ratingScore'),D=document.getElementById('progScore'),E=document.getElementById('hlBox');
if(A)A.innerHTML=t+' <span class="dim">/ '+(v.length*10)+'</span>';
if(B)B.innerHTML=(v.length?a.toFixed(1):'—')+' <span class="dim">/ 10</span>';
if(C)C.textContent=rating(a);
if(D)D.textContent=v.length+' of '+attrs.length;
for(g=0;g<GROUPS.length;g++){var s=0,c=0;
for(i=0;i<attrs.length;i++)if(GI[i]===g&&sc[i]>0){s+=sc[i];c++;}
var el=document.getElementById('ga'+g);if(el)el.textContent=c?(s/c).toFixed(1):'—';}
if(E)E.innerHTML=highlightsHtml({scores:sc});}

function savePerson(e){
e.preventDefault();var f=new FormData(e.target),p=cloneObj(editing),i;
var K=['name','station','role','type','market','assessor','date','strengths','weaknesses','plan','recommendation'];
for(i=0;i<K.length;i++)p[K[i]]=f.get(K[i])||'';
p.scores=[];for(i=0;i<attrs.length;i++)p.scores.push(cp(f.get('score'+i)));
if(!p.id){
var nm=p.name.trim().toLowerCase();
for(i=0;i<people.length;i++)if(String(people[i].name||'').trim().toLowerCase()===nm){
if(!confirm('"'+p.name+'" already exists in this project. Add anyway?'))return;break;}
p.id=String(Date.now())+String(Math.floor(Math.random()*1000));}
var idx=-1;for(i=0;i<people.length;i++)if(people[i].id===p.id){idx=i;break;}
if(idx>=0)people[idx]=p;else people.push(p);
editing=cloneObj(p);dirty=false;clearDraft();save();renderAll();show('talent');}

function deletePerson(id){
if(!confirm('Delete this evaluation? This cannot be undone.'))return;
people=people.filter(function(x){return x.id!==id;});
editing=null;dirty=false;clearDraft();save();renderAll();show('talent');}

function toggleCompare(id){var i=comparison.indexOf(id);
if(i>=0)comparison.splice(i,1);else if(comparison.length<6)comparison.push(id);renderCompare();}

function renderCompare(){
var el=document.getElementById('compare'),i,j;
if(!currentProject){el.innerHTML='<div class="empty"><b>No project selected</b>Enter a project name first.</div>';return;}
if(!comparison.length)comparison=people.slice(0,Math.min(6,people.length)).map(function(p){return p.id;});
var S=people.filter(function(p){return comparison.indexOf(p.id)>=0;});
var h='<div class="panel"><div class="panel-head"><h2>Select up to six employees</h2>';
h+='<span style="font-size:12px;color:var(--muted)">'+S.length+' selected</span></div>';
h+='<div class="panel-body"><div class="compare-picks">';
if(people.length){for(i=0;i<people.length;i++)
h+='<button class="pick'+(comparison.indexOf(people[i].id)>=0?' selected':'')+'" onclick="toggleCompare(\''+people[i].id+'\')">'+esc(people[i].name||'Unnamed')+'</button>';}
else h+='No employees added yet.';
h+='</div></div></div>';
if(S.length){
h+='<div class="panel compare-table"><div class="panel-head"><h2>Attribute comparison</h2>';
h+='<button class="btn no-print" onclick="window.print()">Save PDF</button></div>';
h+='<div class="panel-body" style="padding:4px 14px 14px"><table><thead><tr><th>Attribute</th>';
for(i=0;i<S.length;i++)h+='<th>'+esc(String(S[i].name||'Unnamed').split(' ')[0])+'</th>';
h+='</tr></thead><tbody><tr><td><b>Overall average</b></td>';
var mx=0;for(i=0;i<S.length;i++)mx=Math.max(mx,avg(S[i]));
for(i=0;i<S.length;i++){var a=avg(S[i]);h+='<td class="'+(a===mx&&a>0?'win':'')+'"><b>'+(a?a.toFixed(1):'—')+'</b></td>';}
h+='</tr>';
var g=-1;
for(j=0;j<attrs.length;j++){
if(GI[j]!==g){g=GI[j];
h+='<tr class="grp"><td>'+esc(GROUPS[g].n)+'</td>';
var gm=0;for(i=0;i<S.length;i++)gm=Math.max(gm,gavg(S[i],g));
for(i=0;i<S.length;i++){var q=gavg(S[i],g);h+='<td class="'+(q===gm&&q>0?'win':'')+'">'+(q?q.toFixed(1):'—')+'</td>';}
h+='</tr>';}
var m=0;for(i=0;i<S.length;i++)m=Math.max(m,S[i].scores[j]||0);
h+='<tr><td>'+esc(attrs[j])+'</td>';
for(i=0;i<S.length;i++){var x=S[i].scores[j]||0;h+='<td class="'+(x===m&&m>0?'win':'')+'">'+(x||'—')+'</td>';}
h+='</tr>';}
h+='</tbody></table></div></div>';}
else h+='<div class="empty"><b>Select employees to compare</b>Choose at least one person above.</div>';
el.innerHTML=h;}

function exportCsv(){
var i,j,H=['Name','Type','Years with Dahlsens','Job Title','Region','Assessor','Date','Total','Average','Rating','Recommendation'];
for(i=0;i<GROUPS.length;i++)H.push(GROUPS[i].n+' avg');
H.push('Top strengths','Development priorities');
for(i=0;i<attrs.length;i++)H.push(attrs[i]);
H.push('Strengths','Development opportunities','Development plan');
var R=[H];
for(i=0;i<people.length;i++){var p=fix(people[i]);
var r=[p.name,p.type,p.station,p.role,p.market,p.assessor,p.date,total(p),avg(p).toFixed(2),rating(avg(p)),p.recommendation];
for(j=0;j<GROUPS.length;j++)r.push(gavg(p,j).toFixed(2));
r.push(ranked(p,'hi').map(function(x){return x.n+' ('+x.v+')';}).join('; '));
r.push(ranked(p,'lo').map(function(x){return x.n+' ('+x.v+')';}).join('; '));
for(j=0;j<attrs.length;j++)r.push(p.scores[j]);
r.push(p.strengths,p.weaknesses,p.plan);R.push(r);}
var csv=R.map(function(row){return row.map(function(v){return'"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');
var a=document.createElement('a');
a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));
a.download='dahlsens-valued-attributes.csv';a.click();}

function backup(){
var a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([JSON.stringify(projectBooks)],{type:'application/json'}));
a.download='dahlsens-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();}

function restore(inp){
var f=inp.files[0];if(!f)return;
var r=new FileReader();
r.onload=function(){try{var d=JSON.parse(r.result);
if(!confirm('Restore will replace all saved projects. Continue?'))return;
projectBooks=d;var k=[];for(var x in d)k.push(x);
currentProject=k[0]||'';people=currentProject?cloneObj(projectBooks[currentProject]):[];
comparison=[];editing=null;dirty=false;save();renderAll();show('dashboard');
alert('Restored '+k.length+' project(s).');}
catch(e){alert('That file could not be read.');}};
r.readAsText(f);inp.value='';}

(function(){var b=document.querySelectorAll('.nav button,.mob-nav button');
for(var i=0;i<b.length;i++)b[i].onclick=function(){nav(this.getAttribute('data-view'));};})();
renderAll();show('dashboard');
</script></body></html>
