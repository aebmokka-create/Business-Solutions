<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dahlsens Share of Wallet</title><style>
:root{--g:#173f2d;--g2:#2c6548;--gold:#c79a44;--ink:#18221c;--muted:#68736c;--paper:#fbfaf6;--cream:#f1eee5;--line:#d8ddd7;--red:#a33d34}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:4px}.primary{background:var(--g);color:#fff;border:0;font-weight:bold}header{height:74px;display:flex;align-items:center;padding:0 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.logo{width:39px;height:39px;display:grid;place-items:center;background:var(--g);color:#fff;font:700 24px Georgia;margin-right:12px}.brand{display:flex;flex-direction:column}.brand b{font-size:14px;letter-spacing:.14em}.brand small{color:var(--muted)}#headActions{margin-left:auto;display:flex;gap:8px;align-items:center}.saved{color:#54805f;font-size:12px}.setup{min-height:calc(100vh - 74px);display:grid;grid-template-columns:1fr minmax(420px,600px)}.intro{background:var(--g);color:#fff;padding:7vh 7vw;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:10px;font-weight:bold;letter-spacing:.18em;color:var(--gold);margin:0 0 14px}.intro h1,.heading h1,.results h1{font:normal 46px/1.08 Georgia;margin:0 0 18px}.intro>p:not(.eyebrow){color:#d3ded7;line-height:1.65;font-size:17px}.notice{border-left:3px solid var(--gold);background:#ffffff0c;padding:17px 19px;margin:23px 0;display:flex;flex-direction:column;gap:6px}.notice span{color:#cbd7cf;font-size:12px;line-height:1.5}.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid #ffffff25;padding-top:17px}.scale small{display:block;color:#b9c7be;font-size:11px;line-height:1.4;margin-top:5px}.form{padding:5vh 5vw;align-self:center}.form h2{font:normal 31px Georgia;margin:0 0 5px}.form>p{color:var(--muted);margin:0 0 22px;line-height:1.5}label{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:bold;margin-bottom:15px}input,textarea{padding:11px;border:1px solid #cbd1cb;border-radius:3px;width:100%}.start{width:100%;padding:14px;display:flex;justify-content:space-between}.privacy{display:block;text-align:center;color:var(--muted);margin-top:12px;font-size:11px}.survey,.results{padding:38px clamp(18px,5vw,72px) 48px;max-width:1400px;margin:auto}.heading,.resultTop{display:flex;justify-content:space-between;align-items:start;gap:20px}.heading h1,.results h1{font-size:37px;margin-bottom:8px}.heading p:last-child,.results .sub{color:var(--muted);margin:0;line-height:1.5}.progress{background:#fff;border:1px solid var(--line);padding:12px 15px;margin:26px 0 14px}.progress b{font:normal 25px Georgia}.progress span{float:right;color:var(--muted);font-size:11px;margin-top:9px}.track{height:5px;background:#e1e5e1;margin:8px 0;overflow:hidden;border-radius:5px}.track i{display:block;height:100%;background:var(--gold)}.progress small{color:var(--muted)}.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:17px 0 8px;gap:15px}.table,.rtable{border:1px solid var(--line);background:#fff;overflow-x:auto}.tr{display:grid;grid-template-columns:minmax(180px,24%) minmax(310px,1fr) 125px;border-top:1px solid var(--line);min-height:92px}.th{background:var(--g);color:#fff;border:0;min-height:50px}.th>span{padding:17px 15px;font-size:11px;text-transform:uppercase;display:flex;align-items:center}.criterion{display:grid;grid-template-columns:25px 1fr;gap:8px;align-content:center;padding:12px 15px;margin:0}.criterion>span:first-child{color:#969e98;font-size:10px;padding-top:3px}.criterion strong{display:block;font-size:13px}.question{display:flex;align-items:center;padding:14px 15px;line-height:1.45;font-size:13px;border-left:1px solid var(--line)}.cell{display:grid;place-items:center;border-left:1px solid var(--line);background:#fafbf8}.cell select{width:70px;padding:8px;border:1px solid #cbd1cb;background:#fff;border-radius:4px;font-weight:bold}.notes{display:grid;grid-template-columns:220px 1fr;gap:16px;background:var(--cream);border:1px solid var(--line);padding:16px;margin-top:16px}.notes textarea{min-height:90px}.pager{display:flex;justify-content:flex-end;margin-top:19px}.exports{display:flex;gap:8px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:28px 0}.cards article{background:#fff;border:1px solid var(--line);padding:17px;display:flex;flex-direction:column;gap:7px}.cards span{font-size:10px;text-transform:uppercase;color:var(--muted)}.cards b{font:normal 31px Georgia}.cards small{color:var(--muted);line-height:1.4}.rr{display:grid;grid-template-columns:minmax(180px,24%) minmax(310px,1fr) 90px;align-items:center;border-top:1px solid var(--line);padding:12px 15px;gap:10px;min-width:680px}.rr:first-child{background:var(--g);color:#fff;border:0;font-size:10px;text-transform:uppercase}.rr strong{font-size:12px}.rr strong b{color:#969e98;margin-right:10px;font-size:10px}.rr .rq{font-size:12px;line-height:1.4}.rr .score{text-align:center;font-weight:bold}.totals{background:#f1eee5;font-weight:bold}.risk{color:var(--red)}.disclaimer{font-size:11px;color:var(--muted);border-left:2px solid var(--gold);padding-left:10px;margin-top:18px;line-height:1.5}.resultNotes{white-space:pre-wrap;background:var(--cream);padding:15px;line-height:1.5;margin-top:16px}@media(max-width:850px){header{padding:0 13px}.saved{display:none}.setup{grid-template-columns:1fr}.intro{padding:52px 28px}.form{padding:40px 28px}.survey,.results{padding:28px 14px}.notes{grid-template-columns:1fr}.resultTop{flex-direction:column}.cards{grid-template-columns:1fr}}@media(max-width:520px){.brand small{display:none}.intro h1{font-size:32px}.heading h1,.results h1{font-size:29px}.heading{flex-direction:column}.exports{width:100%}.exports button{flex:1}.tr{grid-template-columns:155px minmax(230px,1fr) 72px;min-width:457px}.criterion{padding:10px 7px;grid-template-columns:18px 1fr}.question{padding:10px}.cell select{width:57px}}@media print{header,.exports,.pager,.heading>button,.progress{display:none!important}.results{padding:10px;max-width:none}.cards{break-inside:avoid}.rtable{overflow:visible}.rr{min-width:0}.results h1{font-size:28px}}
</style></head><body><header><div class="logo">D</div><div class="brand"><b>DAHLSENS</b><small>Share of Wallet</small></div><div id="headActions"></div></header><main id="app"></main><script>
const factors=[
['Awareness','Do customers know the full range Dahlsens can supply?'],
['Consideration','Do customers think of Dahlsens when purchasing categories beyond those they currently buy from us?'],
['Competitor relationships','Are established relationships keeping categories with other suppliers?'],
['Salesperson relationships','Do our salespeople have access to the people who decide where each category is purchased?'],
['Asking for the business','Are we actively asking existing customers for more categories and a greater share of each build?'],
['Follow-up','Are opportunities and quotations being followed through to a decision?'],
['Price','Is our pricing preventing us from winning additional categories?'],
['Overall value','Do customers see sufficient value in buying more of the build from Dahlsens?'],
['Quoting','Is the speed, quality or completeness of our quoting costing us business?'],
['Range and availability','Are gaps in product range or stock availability limiting purchases?'],
['Delivery and reliability','Are concerns about complete, dependable delivery limiting customers’ willingness to give us more business?'],
['Truss and frame connection','Are we failing to turn truss and frame relationships into broader supply relationships?'],
['Customer knowledge','Do we lack a clear understanding of what customers buy elsewhere and why?'],
['Sales capability','Do our salespeople have the product knowledge and confidence to sell the whole build?'],
['Reasons to switch','Are we failing to give customers a compelling reason to move business from an incumbent supplier?']];
const key='dahlsens-share-of-wallet-v1';let data;try{data=JSON.parse(localStorage.getItem(key))}catch{}if(!data||!Array.isArray(data.scores)||data.scores.length!==factors.length)data={view:'setup',manager:'',market:'',scores:Array(factors.length).fill(null),notes:''};const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch{}let x=document.querySelector('.saved');if(x)x.textContent='Saved on this device'}function shell(){document.getElementById('headActions').innerHTML='<span class="saved">Saved on this device</span>'+(data.view==='setup'?'':'<button onclick="go(\'setup\')">Setup</button>')+(data.view==='results'?'<button onclick="go(\'survey\')">Edit grades</button>':'')}function go(view){data.view=view;save();render();window.scrollTo(0,0)}function captureSetup(){data.manager=document.getElementById('manager')?.value.trim()??data.manager;data.market=document.getElementById('market')?.value.trim()??data.market;save()}function setup(){shell();app.innerHTML='<div class="setup"><section class="intro"><p class="eyebrow">SALES MANAGER ASSESSMENT</p><h1>Share of Wallet</h1><p>What stops existing customers from buying more of the build from Dahlsens? Grade your perception of each factor across your market, branch or area.</p><div class="notice"><b>One direction for every grade</b><span>1 means this factor is a major obstacle to winning more business. 10 means the factor is working strongly in Dahlsens’ favour. For questions about a problem, 10 means that problem is not holding us back.</span></div><div class="scale"><span><b>1–3</b><small>Major obstacle</small></span><span><b>4–6</b><small>Mixed or uncertain</small></span><span><b>7–10</b><small>Working in our favour</small></span></div></section><section class="form"><h2>Set up the assessment</h2><p>Record the sales manager’s view of the market as a whole.</p><label>Sales manager<input id="manager" autocomplete="name" value="'+esc(data.manager)+'" placeholder="Name"></label><label>Market, branch or area<input id="market" value="'+esc(data.market)+'" placeholder="Market or area"></label><button class="start primary" onclick="captureSetup();go(\'survey\')">Begin assessment <b>→</b></button><small class="privacy">Grades are saved on this device until you export them.</small></section></div>'}function grade(i,v){data.scores[i]=v===''?null:Number(v);save();updateProgress()}function updateProgress(){let done=data.scores.filter(Number.isInteger).length,pct=Math.round(done/factors.length*100);document.getElementById('percent').textContent=pct+'%';document.getElementById('done').textContent=done+' of '+factors.length+' factors graded';document.getElementById('bar').style.width=pct+'%'}function survey(){shell();app.innerHTML='<section class="survey"><div class="heading"><div><p class="eyebrow">SHARE OF WALLET ASSESSMENT</p><h1>What is limiting additional sales?</h1><p>Grade each factor from 1 to 10 based on your perception of customers across '+esc(data.market||'this market')+'.</p></div><button onclick="go(\'results\')">Summary</button></div><div class="progress"><b id="percent"></b><span>complete</span><div class="track"><i id="bar"></i></div><small id="done"></small></div><div class="legend"><span>1 = major obstacle to winning more business</span><span>10 = working strongly in Dahlsens’ favour</span></div><div class="table"><div class="tr th"><span>Factor</span><span>Question for the sales manager</span><span>Grade 1–10</span></div>'+factors.map(([name,q],i)=>'<div class="tr"><p class="criterion"><span>'+String(i+1).padStart(2,'0')+'</span><span><strong>'+esc(name)+'</strong></span></p><div class="question">'+esc(q)+'</div><div class="cell"><select aria-label="Grade '+esc(name)+' from 1 to 10" onchange="grade('+i+',this.value)"><option value="">—</option>'+Array.from({length:10},(_,j)=>'<option value="'+(j+1)+'" '+(data.scores[i]===j+1?'selected':'')+'>'+(j+1)+'</option>').join('')+'</select></div></div>').join('')+'</div><div class="notes"><label>Assessment by<input value="'+esc(data.manager||'Not entered')+'" disabled></label><label>Evidence and opportunities<textarea oninput="data.notes=this.value;save()" placeholder="What do customers buy elsewhere, why, and what could win that business?">'+esc(data.notes)+'</textarea></label></div><div class="pager"><button class="primary" onclick="go(\'results\')">View results →</button></div></section>';updateProgress()}function average(){let v=data.scores.filter(Number.isInteger);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}function results(){shell();let scored=factors.map(([name,q],i)=>({name,q,v:data.scores[i]})).filter(x=>Number.isInteger(x.v)).sort((a,b)=>a.v-b.v),avg=average();app.innerHTML='<section class="results"><div class="resultTop"><div><p class="eyebrow">SALES MANAGER ASSESSMENT SUMMARY</p><h1>Share of Wallet</h1><p class="sub">'+esc(data.market||'Market not specified')+' · '+esc(data.manager||'Sales manager not specified')+'</p></div><div class="exports"><button onclick="downloadCSV()">Export CSV</button><button onclick="window.print()">Print / Save PDF</button></div></div><div class="cards"><article><span>Overall average</span><b class="'+(avg!==null&&avg<=3?'risk':'')+'">'+(avg===null?'—':avg.toFixed(1))+' <small>/ 10</small></b><small>'+data.scores.filter(Number.isInteger).length+' of '+factors.length+' factors graded. Higher is more favourable.</small></article><article><span>Lowest graded factor</span><b style="font-size:21px">'+esc(scored[0]?.name||'Not established')+'</b><small>'+(scored[0]?'Grade '+scored[0].v+' / 10':'Add grades to identify the principal obstacle.')+'</small></article><article><span>Highest graded factor</span><b style="font-size:21px">'+esc(scored.at(-1)?.name||'Not established')+'</b><small>'+(scored.length?'Grade '+scored.at(-1).v+' / 10':'Add grades to identify a strength.')+'</small></article></div><div class="rtable"><div class="rr"><strong>Factor</strong><span class="rq">Question for the sales manager</span><span class="score">Grade</span></div>'+factors.map(([name,q],i)=>'<div class="rr"><strong><b>'+String(i+1).padStart(2,'0')+'</b>'+esc(name)+'</strong><span class="rq">'+esc(q)+'</span><span class="score '+(data.scores[i]!==null&&data.scores[i]<=3?'risk':'')+'">'+(data.scores[i]??'—')+'</span></div>').join('')+'<div class="rr totals"><strong>Overall average</strong><span></span><span class="score">'+(avg===null?'—':avg.toFixed(1))+'</span></div></div>'+(data.notes?'<div class="resultNotes"><strong>Evidence and opportunities</strong><br>'+esc(data.notes)+'</div>':'')+'<p class="disclaimer">These grades record the sales manager’s perception across a market. Low scores flag factors to investigate with customers, salespeople and transaction data. Unanswered factors are excluded from the average.</p></section>'}function downloadCSV(){let rows=[['Share of Wallet','Sales manager assessment'],['Sales manager',data.manager],['Market, branch or area',data.market],[],['Factor','Question for the sales manager','Grade (1–10; 10 positive)'],...factors.map(([n,q],i)=>[n,q,data.scores[i]??'']),[],['Overall average',average()===null?'':average().toFixed(1)],['Evidence and opportunities',data.notes]];let csv='\ufeff'+rows.map(row=>row.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='Dahlsens-Share-of-Wallet.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function render(){if(!['setup','survey','results'].includes(data.view))data.view='setup';data.view==='setup'?setup():data.view==='survey'?survey():results()}render();
</script></body></html>
