lass="page"></section><section id="report" class="page"></section></div><script>var ATTRS=['Product knowledge','Building construction knowledge','Reading plans','Estimating understanding','Technical credibility','Prospecting','Needs analysis','Whole-of-House selling','Negotiation','Opportunity identification','Quote conversion','Customer retention','Commercial awareness','Margin discipline','Account growth','Pipeline management','Sales reporting','Contact management','Territory management','Route planning','Time management','Follow-up discipline','Digital competency','Accountability','Communication','Problem solving','Attention to detail','Reliability','Resilience'];var SECTIONS=[{label:'Technical skills',start:0,end:5},{label:'Sales skills',start:5,end:12},{label:'Commercial skills',start:12,end:17},{label:'Territory management',start:17,end:20},{label:'Personal attributes',start:20,end:29}];var books=JSON.parse(localStorage.getItem('dahlsens-projects')||'{}');var curPrj=localStorage.getItem('dahlsens-current')||'';var people=curPrj&&books[curPrj]?JSON.parse(JSON.stringify(books[curPrj])):[];var editing=null;var cmpIds=[];var formView=false;function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}function initials(n){return String(n||'').split(/\s+/).map(function(x){return x[0];}).filter(Boolean).slice(0,2).join('');}function calcAvg(scores){var v=scores.filter(function(x){return Number(x)>0;});return v.length?v.reduce(function(a,b){return Number(a)+Number(b);},0)/v.length:0;}function calcTot(scores){return scores.filter(function(x){return Number(x)>0;}).reduce(function(a,b){return Number(a)+Number(b);},0);}function rating(a){var n=Number(a);return n===0?'Not rated':n>=9?'Exceeds expectations':n>=7?'Meets expectations':n>=5?'Needs improvement':'Unsatisfactory';}function badgeClass(a){var n=Number(a);return n===0?'badge-none':n>=9?'badge-exceeds':n>=7?'badge-meets':n>=5?'badge-needs':'badge-unsat';}function pillClass(v){var n=Number(v);return n===0?'pill-zero':n>=8?'pill-high':n>=5?'pill-mid':'pill-low';}function clone(o){return JSON.parse(JSON.stringify(o));}function save(){if(!curPrj)return;books[curPrj]=people;try{localStorage.setItem('dahlsens-projects',JSON.stringify(books));localStorage.setItem('dahlsens-current',curPrj);}catch(e){}}function getLiveScores(){if(!formView)return null;var sc=[];for(var i=0;i<ATTRS.length;i++){var el=document.getElementById('sc'+i);sc.push(el?Math.max(0,Math.min(10,Number(el.value)||0)):0);}return sc;}function show(id){document.querySelectorAll('.pill').forEach(function(b){b.classList.toggle('active',b.dataset.view===id);});document.querySelectorAll('.page').forEach(function(p){p.classList.toggle('active',p.id===id);});if(id==='overview')renderOverview();if(id==='employees'){if(!formView)renderEmpPage();else renderEmpPage();}if(id==='compare')renderCompare();if(id==='report')renderReport();window.scrollTo({top:0,behavior:'smooth'});}document.querySelectorAll('.pill').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.view);});});function openProject(){var f=document.getElementById('projectName');var n=f?f.value.trim():'';if(!n){if(f)f.focus();return;}curPrj=n;people=books[n]?clone(books[n]):[];cmpIds=[];formView=false;editing=null;save();renderOverview();renderEmpPage();show('employees');}function switchProject(sel){var n=sel.value;if(!n)return;curPrj=n;people=books[n]?clone(books[n]):[];cmpIds=[];formView=false;editing=null;try{localStorage.setItem('dahlsens-current',n);}catch(e){}renderOverview();renderEmpPage();show('employees');}function renderProjectHistory(){var el=document.getElementById('projectHistory');if(!el)return;var keys=Object.keys(books).sort();if(!keys.length){el.innerHTML='';return;}var opts=keys.map(function(n){return'<option value="'+esc(n)+'"'+(n===curPrj?' selected':'')+'>'+esc(n)+'</option>';}).join('');el.innerHTML='<div style="font-size:12px;color:#617168;margin-top:10px">Saved projects: <select onchange="switchProject(this)" style="margin-left:6px;border:1px solid #e2e8e2;border-radius:6px;padding:5px 8px;background:#fff;font-size:13px;max-width:200px"><option value="">Choose…</option>'+opts+'</select></div>';}function renderOverview(){var el=document.getElementById('overview');if(!el)return;var count=people.length;var scores=people.map(function(p){return calcAvg(p.scores);});var overall=count?scores.reduce(function(a,b){return a+b;},0)/count:0;var sorted=people.slice().sort(function(a,b){return calcAvg(b.scores)-calcAvg(a.scores);});var top=sorted[0];var html='<div class="project-hero"><div class="eyebrow">Employee Evaluation Scorecard</div><h2>DAHLSENS VALUED ATTRIBUTES</h2><p>Assess, compare and develop your team with a consistent disciplined scorecard.</p><div class="project-row"><input id="projectName" value="'+esc(curPrj)+'" placeholder="Project name"/><button class="btn btn-primary" onclick="openProject()">Open</button></div><div id="projectHistory"></div><p class="project-credit">Created by Tony Bell for Dahlsens Management</p></div>';if(curPrj){html+='<div class="stat-row"><div class="stat"><div class="s-label">Employees</div><div class="s-num">'+count+'</div><div class="s-sub">In this project</div></div><div class="stat"><div class="s-label">Average score</div><div class="s-num">'+(overall?overall.toFixed(1):'—')+'</div><div class="s-sub">Excl. zero values</div></div><div class="stat"><div class="s-label">Top performer</div><div class="s-num" style="font-size:18px">'+(top?esc(top.name.split(' ')[0]):'—')+'</div><div class="s-sub">'+(top&&calcAvg(top.scores)?calcAvg(top.scores).toFixed(1)+' / 10':'No evals yet')+'</div></div></div>';html+='<div class="card"><div class="card-head"><h2>Quick actions</h2></div><div class="card-body" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" onclick="goAddNew()">+ Add employee</button><button class="btn btn-soft" onclick="show(\'employees\')">View employees</button><button class="btn btn-soft" onclick="show(\'report\')">View report</button><button class="btn btn-soft no-print" onclick="exportCsv()">Export CSV</button></div></div>';}el.innerHTML=html;renderProjectHistory();}function goAddNew(){formView=false;editing=null;renderEmpPage();show('employees');setTimeout(function(){startNew();},50);}function renderEmpPage(){var el=document.getElementById('employees');if(!el)return;if(formView&&editing!==null){buildFormHTML();return;}var html='<div class="card"><div class="card-head"><h2>'+(curPrj?'Employees — '+esc(curPrj):'Employees')+'</h2><button class="btn btn-primary btn-sm" onclick="startNew()">+ Add</button></div><div class="card-body"><div class="toolbar"><input class="search-input" id="empSearch" oninput="filterEmps()" placeholder="Search"/><select class="select-input" id="empSort" onchange="filterEmps()"><option value="name">Name</option><option value="score">Score</option><option value="recent">Recent</option></select></div><div id="empCards" class="emp-list"></div></div></div>';el.innerHTML=html;filterEmps();}function filterEmps(){var el=document.getElementById('empCards');if(!el)return;var q=(document.getElementById('empSearch')||{value:''}).value.toLowerCase();var sort=(document.getElementById('empSort')||{value:'name'}).value;var list=people.filter(function(p){return[p.name,p.role,p.market,p.station].join(' ').toLowerCase().indexOf(q)>=0;});list.sort(function(a,b){if(sort==='score')return calcAvg(b.scores)-calcAvg(a.scores);if(sort==='recent')return(b.date||'').localeCompare(a.date||'');return(a.name||'').localeCompare(b.name||'');});if(!list.length){el.innerHTML='<div class="empty"><b>'+(curPrj?'No employees yet':'No project selected')+'</b>'+(curPrj?'Tap + Add to create the first evaluation.':'Go to Overview and open a project.')+'</div>';return;}el.innerHTML=list.map(function(p){var a=calcAvg(p.scores);return'<div class="emp-card" onclick="editPerson(\''+p.id+'\')">'+'<div class="avatar">'+esc(initials(p.name||'?'))+'</div>'+'<div class="emp-info"><b>'+esc(p.name||'Unnamed')+'</b><small>'+esc([p.role,p.station,p.market].filter(Boolean).join(' · ')||'No details')+'</small></div>'+'<div class="emp-score"><b>'+(a?a.toFixed(1):'—')+'</b><small>'+(a?'/ 10':'Not rated')+'</small></div>'+'</div>';}).join('');}function startNew(){if(!curPrj){show('overview');setTimeout(function(){var f=document.getElementById('projectName');if(f)f.focus();},300);return;}editing={id:'',name:'',station:'',role:'',type:'',market:'',assessor:'',date:new Date().toISOString().slice(0,10),scores:Array(ATTRS.length).fill(0),strengths:'',weaknesses:'',plan:'',recommendation:''};formView=true;buildFormHTML();}function editPerson(id){var found=null;for(var i=0;i<people.length;i++){if(people[i].id===id){found=people[i];break;}}if(!found)return;editing=clone(found);formView=true;buildFormHTML();}function buildFormHTML(){var el=document.getElementById('employees');if(!el)return;var p=editing;var scores=p.scores||Array(ATTRS.length).fill(0);var v=scores.filter(function(x){return Number(x)>0;});var t=calcTot(scores);var a=calcAvg(scores);var html='<form id="evalForm" onsubmit="savePerson(event)">';html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap"><button type="button" class="btn btn-soft btn-sm" onclick="cancelForm()">&#8592; Back</button><h2 style="font-size:17px;font-weight:800;flex:1;margin:0">'+(p.id?'Edit: '+esc(p.name):'New Evaluation')+'</h2><span style="font-size:11px;color:var(--muted);background:var(--brand2);padding:4px 10px;border-radius:20px;font-weight:700">'+esc(curPrj)+'</span></div>';html+='<div class="card"><div class="card-head"><h2>Employee details</h2></div><div class="card-body"><div class="form-grid">';html+='<div class="field"><label>Full name *</label><input required name="name" value="'+esc(p.name)+'"/></div>';html+='<div class="field"><label>Employee type</label><select name="type"><option value=""'+((!p.type)?' selected':'')+'>Select…</option><option'+(p.type==='Current Employee'?' selected':'')+'>Current Employee</option><option'+(p.type==='Candidate'?' selected':'')+'>Candidate</option></select></div>';html+='<div class="field"><label>Years with Dahlsens</label><input name="station" value="'+esc(p.station)+'"/></div>';html+='<div class="field"><label>Job title</label><input name="role" value="'+esc(p.role)+'"/></div>';html+='<div class="field"><label>Region</label><input name="market" value="'+esc(p.market)+'"/></div>';html+='<div class="field"><label>Assessor</label><input name="assessor" value="'+esc(p.assessor)+'"/></div>';html+='<div class="field full"><label>Assessment date</label><input name="date" type="date" value="'+esc(p.date)+'"/></div>';html+='</div></div></div>';html+='<div class="card"><div class="card-head"><h2>Performance scorecard</h2><button type="button" class="btn btn-soft btn-sm no-print" onclick="resetScores()">Reset all</button></div><div class="card-body">';html+='<div class="notice">Score 1–10 for each applicable attribute. Leave at 0 to exclude from the average. The Report tab updates live as you score.</div>';html+='<div class="score-summary"><div class="ss-item"><small>Total</small><b id="sumTotal">'+t+'</b></div><div class="ss-item"><small>Average</small><b id="sumAvg">'+(v.length?a.toFixed(1):'—')+'</b></div><div class="ss-item"><small>Rating</small><b id="sumRating" style="font-size:13px;letter-spacing:-.2px">'+rating(a)+'</b></div></div>';SECTIONS.forEach(function(sec){html+='<div class="section-divider">'+sec.label+'</div>';for(var i=sec.start;i<sec.end;i++){html+='<div class="score-row"><span class="score-label">'+(i+1)+'. '+ATTRS[i]+'</span><div class="stepper"><button type="button" class="step-btn" onclick="stepScore('+i+',-1)">−</button><input id="sc'+i+'" class="score-val" type="number" min="0" max="10" value="'+Number(scores[i])+'" oninput="liveUpdate()"/><button type="button" class="step-btn" onclick="stepScore('+i+',1)">+</button></div></div>';}});html+='</div></div>';html+='<div class="card"><div class="card-head"><h2>Notes and recommendation</h2></div><div class="card-body"><div class="form-grid">';html+='<div class="field"><label>Key strengths</label><textarea name="strengths">'+esc(p.strengths)+'</textarea></div>';html+='<div class="field"><label>Development opportunities</label><textarea name="weaknesses">'+esc(p.weaknesses)+'</textarea></div>';html+='<div class="field full"><label>Development plan</label><textarea name="plan">'+esc(p.plan)+'</textarea></div>';html+='<div class="field full"><label>Recommendation</label><div class="rec-grid">';['Exceeds expectations','Meets expectations','Needs improvement','Unsatisfactory'].forEach(function(r){html+='<label class="rec-opt"><input type="radio" name="recommendation" value="'+r+'"'+(p.recommendation===r?' checked':'')+'/> '+r+'</label>';});html+='</div></div></div></div></div>';html+='<div class="form-actions">';if(p.id){html+='<button type="button" class="btn btn-danger btn-sm" onclick="deletePerson(\''+p.id+'\')">Delete</button>';}html+='<button type="button" class="btn btn-soft" onclick="cancelForm()">Cancel</button>';html+='<button type="submit" class="btn btn-primary">Save evaluation</button>';html+='</div></form>';el.innerHTML=html;}function liveUpdate(){var sc=[];for(var i=0;i<ATTRS.length;i++){var el=document.getElementById('sc'+i);sc.push(el?Math.max(0,Math.min(10,Number(el.value)||0)):0);}if(editing)editing.scores=sc;var v=sc.filter(function(x){return x>0;});var t=v.reduce(function(a,b){return a+b;},0);var a=v.length?t/v.length:0;var ts=document.getElementById('sumTotal');var as=document.getElementById('sumAvg');var rs=document.getElementById('sumRating');if(ts)ts.textContent=t;if(as)as.textContent=v.length?a.toFixed(1):'—';if(rs)rs.textContent=rating(a);var rp=document.getElementById('report');if(rp&&rp.classList.contains('active'))renderReport();}function stepScore(i,d){var el=document.getElementById('sc'+i);if(!el)return;el.value=Math.max(0,Math.min(10,(Number(el.value)||0)+d));liveUpdate();}function resetScores(){for(var i=0;i<ATTRS.length;i++){var el=document.getElementById('sc'+i);if(el)el.value=0;}liveUpdate();}function cancelForm(){editing=null;formView=false;renderEmpPage();}function savePerson(e){e.preventDefault();var f=new FormData(e.target);var p=clone(editing);['name','station','role','type','market','assessor','date','strengths','weaknesses','plan','recommendation'].forEach(function(k){p[k]=f.get(k)||'';});p.scores=ATTRS.map(function(_,i){return Math.max(0,Math.min(10,Number(f.get('sc'+i))||0));});if(!p.id)p.id=Date.now().toString(36)+Math.random().toString(36).slice(2);var idx=-1;for(var i=0;i<people.length;i++){if(people[i].id===p.id){idx=i;break;}}if(idx>=0)people[idx]=p;else people.push(p);save();editing=null;formView=false;renderOverview();renderEmpPage();renderReport();}function deletePerson(id){if(!confirm('Delete this evaluation? This cannot be undone.'))return;people=people.filter(function(x){return x.id!==id;});save();editing=null;formView=false;renderOverview();renderEmpPage();renderReport();}function renderCompare(){var el=document.getElementById('compare');if(!el)return;if(!curPrj){el.innerHTML='<div class="empty"><b>No project selected</b>Go to Overview and open a project first.</div>';return;}if(!people.length){el.innerHTML='<div class="empty"><b>No employees yet</b>Add employees first then return here to compare.</div>';return;}if(!cmpIds.length)cmpIds=people.slice(0,Math.min(6,people.length)).map(function(p){return p.id;});var selected=people.filter(function(p){return cmpIds.indexOf(p.id)>=0;});var html='<div class="card"><div class="card-head"><h2>Select employees</h2><span style="font-size:12px;color:var(--muted)">'+selected.length+' / 6 selected</span></div><div class="card-body"><div class="pick-grid">';html+=people.map(function(p){return'<button type="button" class="pick'+(cmpIds.indexOf(p.id)>=0?' on':'')+'" onclick="toggleCmp(\''+p.id+'\')">'+esc(initials(p.name||'?'))+' '+esc(p.name||'Unnamed')+'</button>';}).join('');html+='</div></div></div>';if(selected.length){html+='<div class="card"><div class="card-head"><h2>Attribute comparison</h2><button class="btn btn-soft btn-sm no-print" onclick="window.print()">Print / PDF</button></div><div class="card-body compare-wrap"><table><thead><tr><th>Attribute</th>';selected.forEach(function(p){html+='<th>'+esc((p.name||'Unnamed').split(' ')[0])+'</th>';});html+='</tr></thead><tbody>';html+='<tr><td><b>Overall average</b></td>';var avgs=selected.map(function(p){return calcAvg(p.scores);});var maxAvg=Math.max.apply(null,avgs);selected.forEach(function(p){var a=calcAvg(p.scores);html+='<td class="'+(a>0&&a===maxAvg?'win':'')+'"><b>'+(a?a.toFixed(1):'—')+'</b></td>';});html+='</tr>';html+='<tr><td><b>Total score</b></td>';var tots=selected.map(function(p){return calcTot(p.scores);});var maxTot=Math.max.apply(null,tots);selected.forEach(function(p){var t=calcTot(p.scores);html+='<td class="'+(t>0&&t===maxTot?'win':'')+'"><b>'+t+'</b></td>';});html+='</tr>';for(var i=0;i<ATTRS.length;i++){var attrScores=selected.map(function(p){return Number(p.scores[i])||0;});var maxS=Math.max.apply(null,attrScores);html+='<tr><td>'+esc(ATTRS[i])+'</td>';selected.forEach(function(p){var s=Number(p.scores[i])||0;html+='<td class="'+(s>0&&s===maxS?'win':'')+'">'+( s||'—')+'</td>';});html+='</tr>';}html+='</tbody></table></div></div>';}else{html+='<div class="empty"><b>No employees selected</b>Pick at least one above to compare.</div>';}el.innerHTML=html;}function toggleCmp(id){var idx=cmpIds.indexOf(id);if(idx>=0)cmpIds.splice(idx,1);else if(cmpIds.length<6)cmpIds.push(id);renderCompare();}function renderReport(){var el=document.getElementById('report');if(!el)return;if(!curPrj){el.innerHTML='<div class="empty"><b>No project selected</b>Go to Overview and open a project first.</div>';return;}var reportPeople=people.map(function(p){if(editing&&p.id===editing.id){return clone(editing);}return p;});if(editing&&!editing.id){reportPeople=reportPeople.concat([editing]);}reportPeople=reportPeople.filter(function(p){return p.name;});reportPeople.sort(function(a,b){return calcAvg(b.scores)-calcAvg(a.scores);});if(!reportPeople.length){el.innerHTML='<div class="empty"><b>No evaluations yet</b>Add employees in the Employees tab to see the report here.</div>';return;}var overall=reportPeople.reduce(function(s,p){return s+calcAvg(p.scores);},0)/reportPeople.length;var html='<div class="report-summary"><div class="rs-item"><small>Employees</small><b>'+reportPeople.length+'</b></div><div class="rs-item"><small>Project average</small><b>'+overall.toFixed(1)+'</b></div><div class="rs-item"><small>Top performer</small><b style="font-size:16px">'+esc(reportPeople[0].name.split(' ')[0])+'</b></div></div>';html+='<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn btn-soft btn-sm no-print" onclick="window.print()">Print / PDF</button></div>';reportPeople.forEach(function(p){var sc=p.scores||Array(ATTRS.length).fill(0);var a=calcAvg(sc);var t=calcTot(sc);html+='<div class="report-emp"><div class="report-emp-head"><div class="avatar">'+esc(initials(p.name||'?'))+'</div><div class="report-name"><b>'+esc(p.name||'Unnamed')+'</b><small>'+esc([p.role,p.station,p.market].filter(Boolean).join(' · ')||'No details')+'</small></div><span class="report-badge '+badgeClass(a)+'">'+rating(a)+'</span></div>';html+='<div class="report-meta"><b>'+(a?a.toFixed(1):'—')+'</b><span style="margin-left:4px">/ 10 average &nbsp;·&nbsp; Total: '+t+'</span></div>';html+='<div class="report-scores">';for(var i=0;i<ATTRS.length;i++){var s=Number(sc[i])||0;html+='<div class="report-score-item"><span class="report-score-name">'+(i+1)+'. '+esc(ATTRS[i])+'</span><span class="score-pill '+pillClass(s)+'">'+(s||'—')+'</span></div>';}html+='</div></div>';});el.innerHTML=html;}function exportCsv(){var header=['Name','Type','Years with Dahlsens','Job Title','Region','Assessor','Date','Total','Average','Rating','Recommendation'].concat(ATTRS).concat(['Strengths','Development opportunities','Development plan']);var rows=people.map(function(p){return[p.name,p.type,p.station,p.role,p.market,p.assessor,p.date,calcTot(p.scores),calcAvg(p.scores).toFixed(2),rating(calcAvg(p.scores)),p.recommendation].concat(p.scores).concat([p.strengths,p.weaknesses,p.plan]);});var csv=[header].concat(rows).map(function(row){return row.map(function(v){return'"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');var blob=new Blob([csv],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dahlsens-valued-attributes.csv';a.click();URL.revokeObjectURL(a.href);}renderOverview();show('overview');</script></body></html>
