<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>App</title><style>
:root{--ink:#15251f;--mut:#728078;--line:#dde4dd;--brand:#006d5b}
*{box-sizing:border-box}body{margin:0;background:#f6f7f3;color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#123a32;color:#eef7f2;padding:20px 14px}
aside h3{font-size:14px;margin:0 0 4px}aside p{font-size:10px;color:#9eb9ad;margin:0 0 18px}
.nav{display:grid;gap:4px}
.nav button{background:none;color:#d0e1d8;border-radius:8px;padding:10px;text-align:left;font-size:14px;width:100%}
.nav button.active{background:#1a5c4a;color:#fff}
main{padding:26px 30px 60px;max-width:1400px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:24px;margin:0}
.btn{border-radius:8px;padding:10px 14px;font-weight:700;font-size:13px;background:#e8f0eb;color:#1a5c4a}
.btn.p{background:var(--brand);color:#fff}.btn.d{background:#fcecea;color:#bb453b}
.view{display:none}.view.active{display:block}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.ph h2{font-size:15px;margin:0}.pb{padding:16px 18px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.stat span{font-size:11px;color:var(--mut)}.stat b{display:block;font-size:26px;color:var(--brand);margin-top:6px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:grid;gap:5px;margin-bottom:10px}
.fld label{font-size:12px;font-weight:700;color:#4c5c54}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:9px;font-size:16px;width:100%;background:#fff}
.fld textarea{height:80px}.wide{grid-column:1/-1}
.sum{display:flex;gap:20px;background:#e8f5ed;border:1px solid #c5ddce;padding:14px;border-radius:10px;margin-bottom:16px;flex-wrap:wrap}
.sum small{display:block;font-size:10px;color:#527261;font-weight:800;text-transform:uppercase}
.sum b{font-size:20px;color:var(--brand)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.srow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #eff2ef}
.srow label{font-size:12px}
.stp{display:flex;gap:4px;align-items:center}
.stp button{width:34px;height:34px;border-radius:8px;background:#e8f0eb;color:var(--brand);font-size:19px;font-weight:800;border:1px solid #c5ddce}
.si{width:50px;text-align:center;padding:7px;font-weight:800;font-size:16px;border:1px solid var(--line);border-radius:6px}
.rec{display:flex;gap:8px;flex-wrap:wrap}
.rec label{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;margin-bottom:8px}
.row .n{flex:1;min-width:0}.row b{display:block;font-size:14px}.row small{color:var(--mut);font-size:11px}
.av{width:40px;height:40px;border-radius:12px;background:#1a5c4a;color:#fff;display:grid;place-items:center;font-weight:800}
.sco{font-weight:800;color:var(--brand)}
.lnk{background:none;color:var(--brand);font-weight:800;font-size:12px}
.hero{text-align:center;padding:34px 18px;background:#eef7f1;border:1px solid #d3e5d8;border-radius:14px;margin-bottom:18px}
.hero h2{font-size:30px;color:var(--brand);margin:6px 0}
.hero p{font-size:13px;color:#6c7d74;margin:0 0 20px}
.hero input{padding:11px;border:1px solid #bfd2c4;border-radius:8px;font-size:16px;width:min(320px,80%)}
.empty{padding:40px;text-align:center;color:var(--mut);border:1px dashed #c5ddce;border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left;min-width:160px}
.win{background:#eff8f1;color:var(--brand);font-weight:800}
.pick{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:12px;margin:0 6px 6px 0}
.pick.on{border-color:var(--brand);background:#e8f5ed;color:var(--brand);font-weight:800}
@media(max-width:900px){.app{grid-template-columns:1fr}main{padding:18px 14px 60px}
.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap;width:auto}
.grid4{grid-template-columns:1fr 1fr}.f2,.sgrid{grid-template-columns:1fr}}
@media print{aside,.top,.noprint{display:none!important}.app{display:block}}
</style></head><body>
<div class="app">
<aside><h3 id="lName">APP</h3><p id="lCred"></p>
<div class="nav">
<button class="active" data-v="dash">◫ Overview</button>
<button data-v="dir">♙ Directory</button>
<button data-v="ed">✦ New record</button>
<button data-v="cmp">◈ Compare</button>
</div></aside>
<main>
<div class="top"><h1 id="ttl"></h1>
<div><button class="btn noprint" onclick="exportCsv()">Export CSV</button>
<button class="btn p" onclick="newRecord()">+ New record</button></div></div>
<section id="dash" class="view active"></section>
<section id="dir" class="view"></section>
<section id="ed" class="view"></section>
<section id="cmp" class="view"></section>
</main></div>
<script>
/* ========= CONFIG : the only block you edit ========= */
var APP={key:'myapp',name:'APP NAME',sub:'Evaluation Scorecard',cred:'Created by You',max:10};
var FIELDS=[
 {k:'name',l:'Full name',t:'text',req:1},
 {k:'type',l:'Type',t:'select',o:['Current','Candidate']},
 {k:'org',l:'Organisation',t:'text'},
 {k:'role',l:'Role',t:'text'},
 {k:'assessor',l:'Assessor',t:'text'},
 {k:'date',l:'Date',t:'date'}];
var CRIT=['Criterion one','Criterion two','Criterion three','Criterion four','Criterion five','Criterion six'];
var NOTES=[{k:'str',l:'Key strengths'},{k:'dev',l:'Development opportunities'},{k:'plan',l:'Development plan',w:1}];
var CHOICE={k:'rec',l:'Recommendation',o:['Strong Yes','Yes','Maybe','No']};
var BANDS=[[9,'Elite'],[8,'Excellent'],[7,'Strong'],[6,'Solid'],[5,'Development required'],[0,'Not recommended']];
/* ========= STATE ========= */
var books={},project='',items=[],editing=null,cmp=[];
try{books=JSON.parse(localStorage.getItem(APP.key+'-b')||'{}');project=localStorage.getItem(APP.key+'-c')||'';}catch(e){}
if(project&&books[project])items=books[project];
/* ========= UTILS ========= */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function cl(o){return JSON.parse(JSON.stringify(o));}
function cp(n){n=Number(n);if(isNaN(n))n=0;return Math.max(0,Math.min(APP.max,n));}
function pos(p){return (p.scores||[]).filter(function(x){return Number(x)>0;});}
function tot(p){return pos(p).reduce(function(a,b){return a+Number(b);},0);}
function avg(p){var v=pos(p);return v.length?tot(p)/v.length:0;}
function band(a){if(!a)return'Not rated';for(var i=0;i<BANDS.length;i++)if(a>=BANDS[i][0])return BANDS[i][1];return'';}
function ini(n){return String(n||'?').split(/\s+/).map(function(x){return x[0];}).filter(Boolean).slice(0,2).join('').toUpperCase();}
function save(){if(!project)return;books[project]=items;
 try{localStorage.setItem(APP.key+'-b',JSON.stringify(books));localStorage.setItem(APP.key+'-c',project);}
 catch(e){alert('Could not save. Storage may be full or blocked.');}}
function blank(){var r={id:'',scores:[]};
 for(var i=0;i<CRIT.length;i++)r.scores.push(0);
 FIELDS.forEach(function(f){r[f.k]=f.t==='date'?new Date().toISOString().slice(0,10):'';});
 NOTES.forEach(function(n){r[n.k]='';});r[CHOICE.k]='';return r;}
/* ========= ROUTER ========= */
function show(v){
 var b=document.querySelectorAll('.nav button');
 for(var i=0;i<b.length;i++)b[i].className=(b[i].getAttribute('data-v')===v)?'active':'';
 var s=document.querySelectorAll('.view');
 for(i=0;i<s.length;i++)s[i].className='view'+(s[i].id===v?' active':'');
 var t={dash:APP.name,dir:'Directory',ed:(editing&&editing.id)?'Edit record':'New record',cmp:'Compare'};
 document.getElementById('ttl').textContent=t[v]||v;
 if(v==='cmp')renderCmp();
 window.scrollTo(0,0);}
/* ========= PROJECT ========= */
function openProject(){var f=document.getElementById('pN'),n=f?f.value.trim():'';
 if(!n){alert('Enter a project name.');return;}
 project=n;items=books[n]?cl(books[n]):[];cmp=[];editing=null;save();renderAll();show('dir');}
function switchProject(s){if(!s.value)return;project=s.value;items=books[project]?cl(books[project]):[];
 cmp=[];editing=null;save();renderAll();show('dir');}
/* ========= DASHBOARD ========= */
function renderAll(){renderDash();renderDir();}
function renderDash(){
 var sorted=items.slice().sort(function(a,b){return avg(b)-avg(a);});
 var top=sorted[0],ov=0;
 if(items.length){for(var i=0;i<items.length;i++)ov+=avg(items[i]);ov=ov/items.length;}
 var h='<div class="hero"><h2>'+esc(APP.name)+'</h2><p>'+esc(APP.sub)+'</p>'
 +'<input id="pN" value="'+esc(project)+'" placeholder="Project name"> '
 +'<button class="btn p" onclick="openProject()">Open project</button><div style="margin-top:14px;font-size:12px;color:#617168">';
 var ks=[];for(var k in books)ks.push(k);ks.sort();
 if(ks.length){h+='Return to: <select onchange="switchProject(this)"><option value="">Saved projects</option>';
  for(i=0;i<ks.length;i++)h+='<option'+(ks[i]===project?' selected':'')+'>'+esc(ks[i])+'</option>';h+='</select>';}
 else h+='Enter a project name to begin.';
 h+='</div><p style="font-size:10px;color:#91a198;margin-top:20px">'+esc(APP.cred)+'</p></div>';
 if(project){h+='<div class="grid4">'
 +'<div class="stat"><span>Project</span><b style="font-size:17px">'+esc(project)+'</b></div>'
 +'<div class="stat"><span>Records</span><b>'+items.length+'</b></div>'
 +'<div class="stat"><span>Average</span><b>'+(ov?ov.toFixed(1):'—')+'</b></div>'
 +'<div class="stat"><span>Top ranked</span><b style="font-size:17px">'+(top?esc(top.name||'Unnamed'):'—')+'</b></div></div>';}
 document.getElementById('dash').innerHTML=h;}
/* ========= DIRECTORY ========= */
function renderDir(){
 var h='<div class="panel"><div class="ph"><h2>'+(project?esc(project):'Choose a project first')+'</h2>'
 +'<button class="btn p" onclick="newRecord()">+ Add</button></div><div class="pb">'
 +'<input id="q" oninput="listDir()" placeholder="Search" style="padding:9px;border:1px solid #dde4dd;border-radius:8px;font-size:16px;margin-bottom:12px">'
 +'<div id="cards"></div></div></div>';
 document.getElementById('dir').innerHTML=h;listDir();}
function listDir(){
 var el=document.getElementById('cards');if(!el)return;
 var qEl=document.getElementById('q'),q=qEl?qEl.value.toLowerCase():'';
 var L=items.filter(function(p){var s='';FIELDS.forEach(function(f){s+=' '+p[f.k];});return s.toLowerCase().indexOf(q)>=0;});
 L.sort(function(a,b){return avg(b)-avg(a);});
 if(!L.length){el.innerHTML='<div class="empty"><b>'+(project?'Nothing added yet':'No project selected')+'</b></div>';return;}
 var h='';
 for(var i=0;i<L.length;i++){var p=L[i],a=avg(p);
  h+='<div class="row"><div class="av">'+esc(ini(p.name))+'</div><div class="n"><b>'+esc(p.name||'Unnamed')+'</b>'
  +'<small>'+esc([p.role,p.org].filter(Boolean).join(' · ')||'No details')+'</small></div>'
  +'<div class="sco">'+(a?a.toFixed(1):'—')+' / '+APP.max+'</div>'
  +'<button class="lnk" onclick="editRecord(\''+p.id+'\')">Open</button></div>';}
 el.innerHTML=h;}
/* ========= EDITOR ========= */
function newRecord(){if(!project){alert('Open a project first.');show('dash');return;}
 editing=blank();renderEd();show('ed');}
function editRecord(id){for(var i=0;i<items.length;i++)if(items[i].id===id){editing=cl(items[i]);renderEd();show('ed');return;}}
function renderEd(){
 var p=editing,v=pos(p),t=tot(p),a=avg(p),i;
 var h='<form onsubmit="saveRecord(event)"><div class="panel"><div class="ph"><h2>Details</h2></div><div class="pb"><div class="f2">';
 for(i=0;i<FIELDS.length;i++){var f=FIELDS[i];h+='<div class="fld"><label>'+esc(f.l)+'</label>';
  if(f.t==='select'){h+='<select name="'+f.k+'"><option value="">Select</option>';
   for(var j=0;j<f.o.length;j++)h+='<option'+(p[f.k]===f.o[j]?' selected':'')+'>'+esc(f.o[j])+'</option>';h+='</select>';}
  else h+='<input name="'+f.k+'" type="'+f.t+'"'+(f.req?' required':'')+' value="'+esc(p[f.k])+'">';
  h+='</div>';}
 h+='</div></div></div><div class="panel"><div class="ph"><h2>Scorecard</h2>'
 +'<button type="button" class="btn" onclick="resetScores()">Reset</button></div><div class="pb">'
 +'<div class="sum"><div><small>Total</small><b id="tS">'+t+'</b></div>'
 +'<div><small>Average</small><b id="aS">'+(v.length?a.toFixed(1):'—')+'</b></div>'
 +'<div><small>Rating</small><b id="rS" style="font-size:15px">'+band(a)+'</b></div></div><div class="sgrid">';
 for(i=0;i<CRIT.length;i++)h+='<div class="srow"><label>'+(i+1)+'. '+esc(CRIT[i])+'</label><div class="stp">'
  +'<button type="button" onclick="step('+i+',-1)">-</button>'
  +'<input class="si" id="s'+i+'" name="s'+i+'" type="number" min="0" max="'+APP.max+'" value="'+cp(p.scores[i])+'" oninput="sumUp()">'
  +'<button type="button" onclick="step('+i+',1)">+</button></div></div>';
 h+='</div></div></div><div class="panel"><div class="ph"><h2>Notes</h2></div><div class="pb"><div class="f2">';
 for(i=0;i<NOTES.length;i++)h+='<div class="fld'+(NOTES[i].w?' wide':'')+'"><label>'+esc(NOTES[i].l)+'</label>'
  +'<textarea name="'+NOTES[i].k+'">'+esc(p[NOTES[i].k])+'</textarea></div>';
 h+='<div class="fld wide"><label>'+esc(CHOICE.l)+'</label><div class="rec">';
 for(i=0;i<CHOICE.o.length;i++)h+='<label><input type="radio" name="'+CHOICE.k+'" value="'+esc(CHOICE.o[i])+'"'
  +(p[CHOICE.k]===CHOICE.o[i]?' checked':'')+'> '+esc(CHOICE.o[i])+'</label>';
 h+='</div></div></div></div></div><div style="display:flex;gap:8px;justify-content:flex-end;padding-bottom:30px">'
 +'<button type="button" class="btn" onclick="show(\'dir\')">Cancel</button>';
 if(p.id)h+='<button type="button" class="btn d" onclick="delRecord(\''+p.id+'\')">Delete</button>';
 h+='<button type="submit" class="btn p">Save</button></div></form>';
 document.getElementById('ed').innerHTML=h;}
function step(i,d){var e=document.getElementById('s'+i);if(e){e.value=cp((Number(e.value)||0)+d);sumUp();}}
function resetScores(){for(var i=0;i<CRIT.length;i++){var e=document.getElementById('s'+i);if(e)e.value=0;}sumUp();}
function sumUp(){var v=[],i;
 for(i=0;i<CRIT.length;i++){var e=document.getElementById('s'+i);var n=cp(e?e.value:0);if(n>0)v.push(n);}
 var t=0;for(i=0;i<v.length;i++)t+=v[i];var a=v.length?t/v.length:0;
 var A=document.getElementById('tS'),B=document.getElementById('aS'),C=document.getElementById('rS');
 if(A)A.textContent=t;if(B)B.textContent=v.length?a.toFixed(1):'—';if(C)C.textContent=band(a);}
function saveRecord(e){
 e.preventDefault();
 var fd=new FormData(e.
