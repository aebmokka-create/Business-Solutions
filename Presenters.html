<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Talent Attributes</title><style>:root{--ink:#15251f;--muted:#728078;--paper:#f6f7f3;--line:#dde4dd;--brand:#006d5b;--brand2:#cbf0dc;--danger:#bb453b;--card:#fff;--shadow:0 12px 30px rgba(23,48,39,.08)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-text-size-adjust:100%}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;touch-action:manipulation}input[type="date"]{-webkit-appearance:textfield;appearance:textfield}input[type="number"]{-moz-appearance:textfield;-webkit-appearance:none;appearance:none;text-align:center}.app{display:grid;grid-template-columns:260px 1fr;min-height:100dvh}aside{padding:25px 16px;background:#123a32;color:#eef7f2;display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;overflow-y:auto}.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;padding:0 9px 6px}.logo-mark{height:36px;width:36px;background:var(--brand2);border-radius:10px;color:#123a32;display:grid;place-items:center;font-size:18px;font-weight:900}.logo-text{display:flex;flex-direction:column;line-height:1.2}.logo-text span{font-size:9px;font-weight:500;color:#9eb9ad;letter-spacing:.5px;text-transform:uppercase}.side-subtitle{padding:4px 9px 20px;font-size:10px;color:#9eb9ad}.nav-label{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#a8beb4;margin:9px 10px 8px}.nav{display:grid;gap:4px}.nav button{background:transparent;color:#d0e1d8;border-radius:9px;padding:11px 10px;text-align:left;font-size:14px;touch-action:manipulation;width:100%}.nav button:hover,.nav button.active{background:#1a5c4a;color:#fff}.nav .icon{display:inline-block;width:22px}main{max-width:1500px;width:100%;margin:0 auto;padding:30px 42px 55px}.topbar{display:flex;j order:1px solid var(--line);border-radius:8px;padding:9px 11px;background:white;font-size:12px;cursor:pointer;touch-action:manipulation}.pick.selected{border-color:var(--brand);background:#e8f5ed;color:var(--brand);font-weight:800}.compare-table{overflow:auto;-webkit-overflow-scrolling:touch}.compare-table table{border-collapse:collapse;width:100%;font-size:12px}.compare-table th,.compare-table td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center}.compare-table th:first-child,.compare-table td:first-child{text-align:left;min-width:170px}.compare-table th{color:var(--muted);font-size:11px}.win{color:var(--brand);font-weight:800;background:#eff8f1}.empty{padding:60px 15px;text-align:center;color:var(--muted)}.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:5px}.project-hero{min-height:300px;display:grid;place-items:center;text-align:center;padding:36px 20px;background:linear-gradient(135deg,#f5fbf6,#e6f2e9);border:1px solid #d3e5d8;border-radius:16px;margin-bottom:20px}.project-hero-inner{max-width:590px}.project-hero h2{font-size:37px;letter-spacing:-1.8px;margin:7px 0;color:var(--brand)}.project-hero .sub{font-size:13px;color:#6c7d74;margin:0 0 26px}.project-box{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.project-box input{width:min(340px,65vw);padding:12px;border:1px solid #bfd2c4;border-radius:8px;background:#fff;outline-color:var(--brand);font-size:16px}.project-history{margin-top:15px;font-size:12px;color:#617168}.project-history select{margin-left:7px;border:1px solid #d0ded4;border-radius:6px;padding:6px;background:#fff;max-width:230px;font-size:16px}.project-credit{font-size:10px;color:#91a198;margin:29px 0 0}.directory-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.directory-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:14px;background:#fff}.directory-row .directory-name{flex:1;min-width:0}.directory-row b{display:block;font-size:14px}.directory-row small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.directory-score{text-align:right;font-weight:800;font-size:16px;white-space:nowrap;color:var(--brand)}.directory-score small{font-weight:500;color:var(--muted)}.large-avatar{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#5a9e7a,#123a32);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:800;flex-shrink:0}.empty-directory{grid-column:1/-1;padding:48px 15px;text-align:center;color:var(--muted);border:1px dashed #c5ddce;border-radius:12px}.empty-directory b{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}.mob-nav{display:none}.mob-nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;background:transparent;color:#728078;font-size:10px;font-weight:700;gap:4px;touch-action:manipulation;border:0;cursor:pointer}.mob-nav button.active{color:var(--brand)}.mob-nav .mob-icon{font-size:20px}@media(max-width:1024px){.app{grid-template-columns:1fr}aside{height:auto;position:relative;padding:16px;overflow-y:visible}.nav-label{display:none}.nav{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:6px;padding-bottom:6px}.nav button{white-space:nowrap;flex-shrink:0;width:auto}main{padding:24px 18px 40px}.stat-grid{grid-template-columns:1fr 1fr}.directory-list{grid-template-columns:1fr}}@media(max-width:600px){aside{display:none}.mob-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:100;padding-bottom:env(safe-area-inset-bottom)}.mob-nav button.active{color:var(--brand)}main{padding:16px 14px 80px}.topbar h1{font-size:20px}.topbar{margin-bottom:18px}.stat-grid{grid-template-columns:1fr 1fr;gap:10px}.stat .num{font-size:24px}.stat{padding:14px}.form-layout{grid-template-columns:1fr}.score-grid{grid-template-columns:1fr}.score-summary{gap:10px}.score-summary div{padding-right:10px}.project-hero{m iv></header><section id="dashboard" class="view active"></section><section id="talent" class="view"></section><section id="scorecard" class="view"></section><section id="compare" class="view"></section></main></div><script>var attrs=['Age fit for target demographic appeal','Conservative political fit with audience','Broad general knowledge','Strong, distinctive voice','Humour','Strong conversational ability','Credibility','Believable','Engaging','Sharp','Relevant','Able to hold attention','Relatability','Timing','Listener connection','Curiosity','Topical instinct','Emotional range','Storytelling ability','Discipline','Presence','Energy','Ability to create theatre','Sharp listening skills','Memory','Judgement','Interviewing skill','Consistency','Commercial instinct or awareness'];var projectBooks=JSON.parse(localStorage.getItem('presenters-projects')||'{}');var currentProject=localStorage.getItem('presenters-current')||'';var people=currentProject&&projectBooks[currentProject]?projectBooks[currentProject]:[];var editing=null;var comparison=[];function avg(p){var v=p.scores.filter(function(x){return Number(x)>0});return v.length?v.reduce(function(a,b){return a+b},0)/v.length:0;}function total(p){return p.scores.filter(function(x){return Number(x)>0}).reduce(function(a,b){return a+b},0);}function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}function initials(n){return String(n||'').split(/\s+/).map(function(x){return x[0]}).filter(Boolean).slice(0,2).join('');}function rating(a){return a===0?'Not rated':a>=9?'Elite talent':a>=8?'Excellent':a>=7?'Strong':a>=6?'Solid':a>=5?'Development required':'Not recommended';}function cloneObj(o){return JSON.parse(JSON.stringify(o));}function save(){if(!currentProject)return;projectBooks[currentProject]=people;try{localStorage.setItem('presenters-projects',JSON.stringify(projectBooks));localStorage.setItem('presenters-current',currentProject);}catch(e){}}function projectOptions(){return Object.keys(projectBooks).sort(function(a,b){return a.localeCompare(b);}).map(function(n){return'<option value="'+esc(n)+'"'+(n===currentProject?' selected':'')+'>'+esc(n)+'</option>';}).join('');}function openProject(){var f=document.getElementById('projectName');var n=f?f.value.trim():'';if(!n){if(f)f.focus();return;}currentProject=n;people=projectBooks[n]?cloneObj(projectBooks[n]):[];comparison=[];save();editing=null;renderAll();show('talent');}function switchProject(sel){var n=sel.value;if(!n)return;currentProject=n;people=projectBooks[n]?cloneObj(projectBooks[n]):[];comparison=[];try{localStorage.setItem('presenters-current',n);}catch(e){}editing=null;renderAll();show('talent');}function show(id){document.querySelectorAll('.nav button, .mob-nav button').forEach(function(x){x.classList.toggle('active',x.dataset.view===id);});document.querySelectorAll('.view').forEach(function(x){x.classList.toggle('active',x.id===id);});var titles={dashboard:'Talent Attributes',talent:'Talent Directory',scorecard:editing?'Edit Evaluation':'New Evaluation',compare:'Compare Talent'};var te=document.getElementById('pageTitle');var ce=document.getElementById('crumb');if(te)te.textContent=titles[id]||id;if(ce)ce.textContent=id==='scorecard'?'Evaluation workspace':'On-Air Talent Evaluation';if(id==='compare')renderCompare();window.scrollTo({top:0,behavior:'smooth'});}function renderAll(){renderDashboard();renderTalent();if(editing)renderScorecard(editing);}function renderDashboard(){var ranked=people.slice().sort(function(a,b){return avg(b)-avg(a);});var top=ranked[0];var count=people.length;var overall=count?people.reduce(function(s,p){return s+avg(p);},0)/count:0;var html='<div class="project-hero"><div class="project-hero-inner">';html+='<div class="eyebrow">On-Air Talent Evaluation Scorecard</div>';html+='<h2>TALENT ATTRIBUTES</h2>';html+='<p class="sub">Assess, compare and develop on-air talent with a disciplined, consistent scorecard.</p>';html+='<div class="project-box"><input id="projectName" value="'+esc(currentProject)+'" placeholder="Project name" />';html+='<button class="btn primary" onclick="openProject()">Open project</button></div>';html+='<div class="project-history">';var keys=Object.keys(projectBooks);if(keys.length){html+='Return to: <select onchange="switchProject(this)"><option value="">Saved projects</option>'+projectOptions()+'</select>';}else{html+='Enter a project name to begin.';}html+='</div>';html+='<p class="project-credit">Created by Tony Bell · Former CEO, Southern Cross Broadcasting</p>';html+='</div></div>';if(currentProject){html+='<div class="stat-grid">';html+='<div class="stat"><div class="label">Project</div><div class="num" style="font-size:20px">'+esc(currentProject)+'</div><div class="sub">Current workspace</div></div>';html+='<div class="stat"><div class="label">People assessed</div><div class="num">'+count+'</div><div class="sub">Profiles in this project</div></div>';html+='<div class="stat"><div class="label">Average score</div><div class="num">'+(overall?overall.toFixed(1):'—')+'</div><div class="sub">Zero values not included</div></div>';html+='<div class="stat"><div class="label">Top performer</div><div class="num" style="font-size:20px">'+(top?esc(top.name):'—')+'</div><div class="sub">'+(top?avg(top).toFixed(1)+' / 10':'No evaluations yet')+'</div></div>';html+='</div>';}document.getElementById('dashboard').innerHTML=html;}function renderTalent(){var title=currentProject?'People assessed in '+esc(currentProject):'Choose a project first';var html='<div class="panel"><div class="panel-head"><h2>'+title+'</h2>';html+='<button class="btn primary" onclick="newEvaluation()">+ Add person</button></div>';html+='<div class="panel-body"><div class="toolbar">';html+='<input class="search" id="search" oninput="filterTalent()" placeholder="Search names" />';html+='<select id="sort" class="select" onchange="filterTalent()"><option value="name">Sort: Name</option><option value="score">Sort: Score</option><option value="recent">Sort: Recent</option></select></div>';html+='<div id="talentCards" class="directory-list"></div></div></div>';document.getElementById('talent').innerHTML=html;filterTalent();}function filterTalent(){var area=document.getElementById('talentCards');if(!area)return;var q=(document.getElementById('search')||{value:''}).value.toLowerCase();var sort=(document.getElementById('sort')||{value:'name'}).value;var list=people.filter(function(p){return[p.name,p.station,p.role,p.market].join(' ').toLowerCase().indexOf(q)>=0;});list.sort(function(a,b){if(sort==='score')return avg(b)-avg(a);if(sort==='recent')return(b.date||'').localeCompare(a.date||'');return(a.name||'').localeCompare(b.name||'');});if(!list.length){area.innerHTML='<div class="empty-directory"><b>'+(currentProject?'No people added yet':'No project selected')+'</b>'+(currentProject?'Click Add person to begin.':'Enter a project name first.')+'</div>';return;}area.innerHTML=list.map(function(p){var a=avg(p);return'<article class="directory-row"><div class="large-avatar">'+initials(p.name||'?')+'</div><div class="directory-name"><b>'+esc(p.name||'Unnamed')+'</b><small>'+esc([p.role,p.station,p.market].filter(Boolean).join(' · ')||'No details yet')+'</small></div><div class="directory-score">'+(a?a.toFixed(1):'—')+'<small> / 10</small></div><button class="textbtn" onclick="editPerson(\''+p.id+'\')">Open →</button></article>';}).join('');}function newEvaluation(){if(!currentProject){show('dashboard');var f=document.getElementById('projectName');if(f)f.focus();return;}editing={id:'',name:'',station:'',role:'',type:'',market:'',assessor:'',date:new Date().toISOString().slice(0,10),scores:Array(attrs.length).fill(0),strengths:'',weaknesses:'',plan:'',recommendation:''};renderScorecard(editing);show('scorecard');}function editPerson(id){var found=null;for(var i=0;i<people.length;i++){if(people[i].id===id){found=people[i];break;}}if(!found)return;editing=cloneObj(found);renderScorecard(editing);show('scorecard');}function stepScore(i,d){var el=document.getElementById('score'+i);if(!el)return;var v=Math.max(0,Math.min(10,(Number(el.value)||0)+d));el.value=v;updateSummary();}function renderScorecard(p){var vs=p.scores.filter(function(v){return Number(v)>0});var t=vs.reduce(function(a,b){return a+b;},0);var a=vs.length?t/vs.length:0;var html='<form onsubmit="savePerson(event)">';html+='<div class="panel"><div class="panel-head"><h2>Profile details</h2><span class="tag">'+(currentProject?esc(currentProject):'No project')+'</span></div>';html+='<div class="panel-body"><div class="form-layout">';html+='<div class="field"><label>Full name *</label><input required name="name" value="'+esc(p.name)+'" /></div>';html+='<div class="field"><label>Talent type</label><select name="type"><option value=""'+((!p.type)?' selected':'')+'>Select type</option><option'+(p.type==='Current talent'?' selected':'')+'>Current talent</option><option'+(p.type==='Candidate'?' selected':'')+'>Candidate</option></select></div>';html+='<div class="field"><label>Station</label><input name="station" value="'+esc(p.station)+'" /></div>';html+='<div class="field"><label>Role</label><input name="role" value="'+esc(p.role)+'" /></div>';html+='<div class="field"><label>Market</label><input name="market" value="'+esc(p.market)+'" /></div>';html+='<div class="field"><label>Assessor</label><input name="assessor" value="'+esc(p.assessor)+'" /></div>';html+='<div class="field"><label>Assessment date</label><input name="date" type="date" value="'+esc(p.date)+'" /></div>';html+='</div></div></div>';html+='<div class="panel"><div class="panel-head"><h2>Performance scorecard</h2><button type="button" class="btn soft no-print" onclick="resetScores()">Reset to 0</button></div>';html+='<div class="panel-body"><div class="notice" style="margin-bottom:18px">Enter 1-10 for applicable attributes. Leave at 0 if not applicable - it will not be included in the average.</div>';html+='<div class="score-summary"><div><small>Total score</small><b id="totalScore">'+t+' <span style="font-size:12px;color:#527261">/ '+(vs.length*10)+'</span></b></div>';html+='<div><small>Average rating</small><b id="averageScore">'+(vs.length?a.toFixed(1):'—')+' <span style="font-size:12px;color:#527261">/ 10</span></b></div>';html+='<div><small>Rating</small><b id="ratingScore" style="font-size:16px">'+rating(a)+'</b></div></div>';html+='<div class="score-grid">';for(var i=0;i<attrs.length;i++){html+='<div class="score-row"><label for="score'+i+'">'+(i+1)+'. '+attrs[i]+'</label>';html+='<div class="score-stepper"><button type="button" class="stepper-btn" onclick="stepScore('+i+',-1)">−</button>';html+='<input id="score'+i+'" class="score-input" name="score'+i+'" type="number" min="0" max="10" value="'+p.scores[i]+'" oninput="updateSummary()" />';html+='<button type="button" class="stepper-btn" onclick="stepScore('+i+',1)">+</button></div></div>';}html+='</div></div></div>';html+='<div class="panel"><div class="panel-head"><h2>Assessment notes and recommendation</h2></div><div class="panel-body"><div class="form-layout">';html+='<div class="field"><label>Key strengths</label><textarea name="strengths">'+esc(p.strengths)+'</textarea></div>';html+='<div class="field"><label>Development opportunities</label><textarea name="weaknesses">'+esc(p.weaknesses)+'</textarea></div>';html+='<div class="field wide"><label>Development plan</label><textarea name="plan">'+esc(p.plan)+'</textarea></div>';html+='<div class="field wide"><label>Recommendation</label><div class="recommend">';['Strong Yes','Yes','Maybe','No'].forEach(function(r){html+='<label><input type="radio" name="recommendation" value="'+r+'"'+(p.recommendation===r?' checked':'')+' /> '+r+'</label>';});html+='</div></div></div></div></div>';html+='<div class="actions" style="justify-content:flex-end;padding-bottom:20px">';html+='<button type="button" class="btn soft" onclick="show(\'talent\')">Cancel</button>';if(p.id){html+='<button type="button" class="btn danger" onclick="deletePerson(\''+p.id+'\')">Delete</button>';}html+='<button type="submit" class="btn primary">Save evaluation</button></div></form>';document.getElementById('scorecard').innerHTML=html;}function updateSummary(){var sc=[];for(var i=0;i<attrs.length;i++){var el=document.getElementById('score'+i);sc.push(Math.max(0,Math.min(10,Number(el?el.value:0)||0)));}var v=sc.filter(function(x){return x>0;});var t=v.reduce(function(a,b){return a+b;},0);var a=v.length?t/v.length:0;var ts=document.getElementById('totalScore');var as=document.getElementById('averageScore');var rs=document.getElementById('ratingScore');if(ts)ts.innerHTML=t+' <span style="font-size:12px;color:#527261">/ '+(v.length*10)+'</span>';if(as)as.innerHTML=(v.length?a.toFixed(1):'—')+' <span style="font-size:12px;color:#527261">/ 10</span>';if(rs)rs.textContent=rating(a);}function resetScores(){for(var i=0;i<attrs.length;i++){var el=document.getElementById('score'+i);if(el)el.value=0;}updateSummary();}function savePerson(e){e.preventDefault();var f=new FormData(e.target);var p=cloneObj(editing);['name','station','role','type','market','assessor','date','strengths','weaknesses','plan','recommendation'].forEach(function(k){p[k]=f.get(k)||'';});p.scores=attrs.map(function(_,i){return Math.max(0,Math.min(10,Number(f.get('score'+i))||0));});if(!p.id)p.id=String(Date.now());var idx=-1;for(var i=0;i<people.length;i++){if(people[i].id===p.id){idx=i;break;}}if(idx>=0)people[idx]=p;else people.push(p);editing=cloneObj(p);save();renderAll();show('talent');}function deletePerson(id){if(confirm('Delete this evaluation? This cannot be undone.')){people=people.filter(function(x){return x.id!==id});save();editing=null;renderAll();show('talent');}}function renderCompare(){if(!currentProject){document.getElementById('compare').innerHTML='<div class="empty"><b>No project selected</b>Enter a project name first.</div>';return;}if(!comparison.length)comparison=people.slice(0,Math.min(6,people
