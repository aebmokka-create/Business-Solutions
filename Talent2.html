<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Talent Attributes — On-Air Talent Evaluation Scorecard</title>
<style>
  :root{--ink:#15251f;--muted:#728078;--paper:#f6f7f3;--line:#dde4dd;--brand:#006d5b;--brand2:#cbf0dc;--gold:#e6a93e;--danger:#bb453b;--card:#fff;--shadow:0 12px 30px rgba(23,48,39,.08)}
  *{box-sizing:border-box} body{margin:0;background:var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
  button,input,select,textarea{font:inherit} button{cursor:pointer;border:0} .app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
  aside{padding:25px 16px;background:#123a32;color:#eef7f2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.3px;padding:0 9px 6px}.logo-mark{height:30px;width:30px;background:var(--brand2);border-radius:10px;color:#123a32;display:grid;place-items:center;font-size:16px}.side-subtitle{padding:0 9px 24px;font-size:10px;line-height:1.55;color:#9eb9ad}.side-subtitle span{color:#769c8d}.nav-label{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#a8beb4;margin:9px 10px 8px}.nav{display:grid;gap:4px}.nav button{background:transparent;color:#d0e1d8;border-radius:9px;padding:11px 10px;text-align:left;font-size:14px}.nav button:hover,.nav button.active{background:#235348;color:#fff}.nav .icon{display:inline-block;width:22px}.account{margin-top:auto;border-top:1px solid #396257;padding:17px 9px 0;font-size:13px;color:#b4c9bf}.account strong{color:white;display:block;margin-bottom:2px}.signout{background:transparent;color:#b4c9bf;padding:10px 0 0;font-size:12px;text-decoration:underline}
  main{max-width:1500px;width:100%;margin:0 auto;padding:30px 42px 55px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:29px}.eyebrow{text-transform:uppercase;letter-spacing:1.2px;font-size:10px;color:var(--brand);font-weight:800}.topbar h1{font-size:27px;letter-spacing:-1px;margin:5px 0 0}.actions{display:flex;gap:9px}.btn{border-radius:8px;padding:10px 14px;font-weight:700;font-size:13px}.btn.primary{background:var(--brand);color:#fff;box-shadow:0 5px 10px #006d5b27}.btn.soft{background:#e8f0eb;color:#26473c}.btn.danger{color:var(--danger);background:#fcecea}.btn:hover{filter:brightness(.96)}
  .view{display:none}.view.active{display:block}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:19px;box-shadow:var(--shadow)}.stat .label{font-size:12px;color:var(--muted);font-weight:600}.stat .num{font-size:31px;letter-spacing:-1.5px;font-weight:800;margin:8px 0 2px}.stat .sub{font-size:11px;color:var(--muted)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);margin-bottom:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.panel h2{font-size:16px;margin:0;letter-spacing:-.3px}.panel-body{padding:18px 20px}.split{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.leader-list{display:grid;gap:13px}.leader{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px}.rank{height:27px;width:27px;border-radius:8px;background:#eaf3ed;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--brand)}.avatar{height:34px;width:34px;border-radius:50%;background:linear-gradient(140deg,#d3b492,#7a4638);color:white;display:grid;place-items:center;font-weight:800;font-size:12px}.person{display:flex;align-items:center;gap:9px}.person b{font-size:13px}.person small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.score{font-weight:800;font-size:14px}.score small{color:var(--muted);font-weight:500}.mini-bars{padding-top:4px}.barrow{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;margin:12px 0;font-size:12px}.track{height:7px;background:#edf1ed;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--brand);border-radius:10px}.notice{background:#edf7ef;border-radius:9px;padding:14px;font-size:12px;color:#2a5140;line-height:1.5}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:0 0 18px}.search{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 12px;min-width:240px;outline:none}.select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;color:#34463d;font-size:13px}.talent-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.talent-card{border:1px solid var(--line);border-radius:12px;background:white;padding:18px;box-shadow:var(--shadow);transition:.2s}.talent-card:hover{transform:translateY(-2px);border-color:#b7cec0}.card-top{display:flex;justify-content:space-between;gap:8px}.large-avatar{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#e2af78,#87574a);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:800}.tag{font-size:10px;font-weight:800;color:#21604f;background:#e9f5ee;padding:5px 7px;border-radius:20px;height:fit-content}.tag.candidate{background:#fff1d9;color:#8a5a0c}.talent-card h3{font-size:16px;margin:13px 0 3px}.talent-card p{font-size:12px;color:var(--muted);margin:0}.card-score{display:flex;align-items:baseline;gap:5px;margin:17px 0 12px}.card-score b{font-size:27px;letter-spacing:-1px}.card-score span{color:var(--muted);font-size:12px}.meter{height:7px;background:#edf1ed;border-radius:6px;overflow:hidden}.card-foot{margin-top:15px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.textbtn{color:var(--brand);background:transparent;font-weight:800;font-size:12px;padding:0}
  .form-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:700;color:#4c5c54}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:10px;background:white;outline-color:var(--brand);width:100%}.field textarea{height:83px;resize:vertical}.wide{grid-column:1/-1}.score-summary{display:flex;gap:22px;background:#e8f5ed;padding:15px 17px;border-radius:10px;margin-bottom:18px}.score-summary div{border-right:1px solid #c5ddce;padding-right:22px}.score-summary div:last-child{border:0}.score-summary small{display:block;font-size:10px;color:#527261;text-transform:uppercase;letter-spacing:.7px;font-weight:800}.score-summary b{font-size:22px;letter-spacing:-1px}.score-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 26px}.score-row{display:grid;grid-template-columns:1fr 44px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #eff2ef}.score-row label{font-size:12px;line-height:1.2}.score-input{width:44px!important;text-align:center;padding:6px!important;font-weight:800}.recommend{display:flex;gap:8px;flex-wrap:wrap}.recommend label{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12px;cursor:pointer}.recommend input{accent-color:var(--brand)}
  .compare-picks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.pick{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:white;font-size:12px;cursor:pointer}.pick.selected{border-color:var(--brand);background:#e7f5ed;color:var(--brand);font-weight:800}.compare-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:18px}.canvas-wrap{height:390px;display:grid;place-items:center;overflow:hidden}.canvas-wrap canvas{max-width:100%;height:auto}.compare-table{overflow:auto}.compare-table table{border-collapse:collapse;width:100%;font-size:12px}.compare-table th,.compare-table td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center}.compare-table th:first-child,.compare-table td:first-child{text-align:left;min-width:170px}.compare-table th{color:var(--muted);font-size:11px}.win{color:var(--brand);font-weight:800;background:#eff8f1}
  .empty{padding:60px 15px;text-align:center;color:var(--muted)}.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:5px}.login{min-height:100vh;background:linear-gradient(130deg,#103b32,#065d51);display:grid;place-items:center;padding:20px}.login-card{width:min(410px,100%);background:white;border-radius:18px;padding:36px;box-shadow:0 25px 70px #061e1982}.login-card .logo{padding:0 0 25px;color:var(--ink)}.login h1{font-size:25px;letter-spacing:-1px;margin:0 0 8px}.login p{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 24px}.login .btn{width:100%;margin-top:7px}.hint{font-size:11px!important;background:#f0f5f1;padding:10px!important;border-radius:7px;margin-top:18px!important}
  @media(max-width:900px){.app{grid-template-columns:1fr}aside{height:auto;position:relative;padding:16px}.logo{padding-bottom:12px}.nav-label,.account{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.app main{padding:24px 18px}.stat-grid{grid-template-columns:1fr 1fr}.split,.compare-grid{grid-template-columns:1fr}.talent-grid{grid-template-columns:1fr 1fr}}@media(max-width:580px){.topbar{align-items:flex-start;gap:15px}.actions{flex-wrap:wrap;justify-content:flex-end}.stat-grid,.talent-grid,.form-layout,.score-grid{grid-template-columns:1fr}.topbar h1{font-size:23px}.score-summary{gap:13px}.score-summary div{padding-right:13px}.barrow{grid-template-columns:90px 1fr 25px}}
  @media print{aside,.topbar,.toolbar,.actions,.no-print{display:none!important}.app{display:block}.view{display:none!important}.view.active{display:block!important}main{padding:0;max-width:none}.panel{box-shadow:none;break-inside:avoid}.canvas-wrap{height:360px}}
</style>
</head>
<body>
<div id="app" class="app">
 <aside><div class="logo"><span class="logo-mark">T</span> TALENT ATTRIBUTES</div><div class="side-subtitle">On-Air Talent Evaluation Scorecard<br><span>Created by Tony Bell · Former CEO, Southern Cross Broadcasting</span></div><div class="nav-label">WORKSPACE</div><nav class="nav"><button class="active" data-view="dashboard"><span class="icon">◫</span> Overview</button><button data-view="talent"><span class="icon">♙</span> Talent directory</button><button data-view="scorecard"><span class="icon">✦</span> New evaluation</button><button data-view="compare"><span class="icon">◈</span> Compare talent</button></nav><div class="account"><strong id="accountName">Evaluator</strong><span>Talent team</span></div></aside>
 <main>
  <header class="topbar"><div><div class="eyebrow" id="crumb">Talent intelligence</div><h1 id="pageTitle">Overview</h1></div><div class="actions"><button class="btn soft" onclick="exportCsv()">Export CSV</button><button class="btn primary" onclick="newEvaluation()">+ New evaluation</button></div></header>
  <section id="dashboard" class="view active"></section>
  <section id="talent" class="view"></section>
  <section id="scorecard" class="view"></section>
  <section id="compare" class="view"></section>
 </main>
</div>
<script>
const attrs=['Age fit for target demographic appeal','Conservative political fit with audience','Broad general knowledge','Strong, distinctive voice','Humour','Strong conversational ability','Credibility','Believable','Engaging','Sharp','Relevant','Able to hold attention','Relatability','Timing','Listener connection','Curiosity','Topical instinct','Emotional range','Storytelling ability','Discipline','Presence','Energy','Ability to create theatre','Sharp listening skills','Memory','Judgement','Interviewing skill','Consistency','Commercial instinct or awareness'];
const seed=[
 {id:'1',name:'Mia Carter',station:'Metro 101.3',role:'Breakfast Host',type:'Current talent',market:'Sydney',assessor:'Avery Bell',date:'2026-07-22',scores:[9,8,9,10,9,9,9,9,10,9,9,10,9,10,10,8,9,9,9,9,10,9,9,9,8,9,9,9,8],strengths:'Magnetic presence, fast topical instincts and exceptional listener connection.',weaknesses:'Could make more room for guest responses.',plan:'Develop longer-form interview pacing.',recommendation:'Strong Yes'},
 {id:'2',name:'Jordan Lee',station:'Wave FM',role:'Drive Host',type:'Current talent',market:'Melbourne',assessor:'Avery Bell',date:'2026-07-19',scores:[8,8,8,8,10,9,8,9,9,9,8,9,9,9,9,9,9,8,9,8,9,9,9,8,9,8,9,9,9],strengths:'Effortless humour and brilliant commercial instincts.',weaknesses:'Voice is less distinctive in a crowded market.',plan:'Voice imaging and character development sessions.',recommendation:'Yes'},
 {id:'3',name:'Sienna Brooks',station:'Independent',role:'Recruitment candidate',type:'Candidate',market:'Brisbane',assessor:'Avery Bell',date:'2026-07-17',scores:[9,7,8,9,8,9,8,8,9,8,8,9,9,8,9,9,8,9,10,9,9,8,8,9,8,9,9,8,7],strengths:'Natural storyteller with a warm, distinctive voice.',weaknesses:'Needs a stronger sense of commercial format.',plan:'Trial a regular live break and brand-read workshop.',recommendation:'Yes'},
 {id:'4',name:'Theo Grant',station:'Metro 101.3',role:'Weekend Presenter',type:'Current talent',market:'Sydney',assessor:'Avery Bell',date:'2026-07-11',scores:[8,8,9,8,7,8,9,9,8,8,9,8,8,8,8,9,9,8,8,10,8,8,7,9,9,9,8,9,8],strengths:'Trustworthy, disciplined and exceptionally prepared.',weaknesses:'Could take more creative risks on air.',plan:'Build theatricality through segment prototyping.',recommendation:'Maybe'}
];
let people=JSON.parse(localStorage.getItem('talent-attributes')||localStorage.getItem('signal-talent')||'null')||seed, editing=null, comparison=[];
const avg=p=>{let values=p.scores.filter(v=>Number(v)>0);return values.length?values.reduce((a,b)=>a+b,0)/values.length:0}; const total=p=>p.scores.reduce((a,b)=>a+b,0); const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){localStorage.setItem('talent-attributes',JSON.stringify(people))} function initials(n){return n.split(/\s+/).map(x=>x[0]).slice(0,2).join('')}
function rating(a){return a>=9?'Elite talent':a>=8?'Excellent':a>=7?'Strong':a>=6?'Solid':a>=5?'Development required':'Not recommended'}
function signIn(){document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;document.getElementById('accountName').textContent=(document.getElementById('email').value.split('@')[0]||'Evaluator').replace(/(^|[._-])(.)/g,(m,a,b)=>' '+b.toUpperCase()).trim();renderAll()}
function signOut(){document.getElementById('app').hidden=true;document.getElementById('login').hidden=false}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));
function show(id){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===id));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===id));let titles={dashboard:'Overview',talent:'Talent directory',scorecard:editing?'Edit evaluation':'New evaluation',compare:'Compare talent'};document.getElementById('pageTitle').textContent=titles[id];document.getElementById('crumb').textContent=id==='scorecard'?'Evaluation workspace':'Talent intelligence';if(id==='compare')renderCompare();window.scrollTo({top:0,behavior:'smooth'})}
function renderAll(){renderDashboard();renderTalent();if(editing)renderScorecard(editing)}
function renderDashboard(){let ranked=[...people].sort((a,b)=>avg(b)-avg(a)), top=ranked[0], count=people.length, candidates=people.filter(p=>p.type==='Candidate').length, overall=count?people.reduce((s,p)=>s+avg(p),0)/count:0;
 document.getElementById('dashboard').innerHTML=`<div class="stat-grid"><div class="stat"><div class="label">Talent evaluated</div><div class="num">${count}</div><div class="sub">${candidates} recruitment candidate${candidates===1?'':'s'}</div></div><div class="stat"><div class="label">Average talent score</div><div class="num">${overall.toFixed(1)}</div><div class="sub">Across all completed evaluations</div></div><div class="stat"><div class="label">Top performer</div><div class="num">${top?avg(top).toFixed(1):'—'}</div><div class="sub">${top?esc(top.name):'No evaluations yet'}</div></div><div class="stat"><div class="label">Strong recommendations</div><div class="num">${people.filter(p=>p.recommendation==='Strong Yes').length}</div><div class="sub">Ready for the next opportunity</div></div></div><div class="split"><div class="panel"><div class="panel-head"><h2>Talent leaderboard</h2><button class="textbtn" onclick="show('talent')">View directory →</button></div><div class="panel-body"><div class="leader-list">${ranked.slice(0,5).map((p,i)=>`<div class="leader"><div class="rank">${i+1}</div><div class="person"><div class="avatar">${initials(p.name)}</div><div><b>${esc(p.name)}</b><small>${esc(p.role)} · ${esc(p.market)}</small></div></div><div class="score">${avg(p).toFixed(1)} <small>/ 10</small></div></div>`).join('')||'<div class="empty"><b>No evaluations yet</b>Create your first scorecard to get started.</div>'}</div></div></div><div class="panel"><div class="panel-head"><h2>Team capability</h2></div><div class="panel-body"><div class="mini-bars">${[['Listener connection',14],['Presence',20],['Storytelling ability',18],['Commercial instinct or awareness',28]].map(([n,i])=>{let v=count?people.reduce((s,p)=>s+p.scores[i],0)/count:0;return `<div class="barrow"><span>${n}</span><div class="track"><div class="fill" style="width:${v*10}%"></div></div><b>${v.toFixed(1)}</b></div>`}).join('')}</div><div class="notice">Use the comparison view to explore where leading talent differs—then turn those gaps into practical development goals.</div></div></div></div>`}
function renderTalent(){document.getElementById('talent').innerHTML=`<div class="toolbar"><input class="search" id="search" oninput="filterTalent()" placeholder="Search name, station or role"/><select id="typeFilter" class="select" onchange="filterTalent()"><option value="">All talent</option><option>Current talent</option><option>Candidate</option></select><select id="sort" class="select" onchange="filterTalent()"><option value="score">Sort: Overall score</option><option value="name">Sort: Name</option><option value="recent">Sort: Most recent</option></select></div><div id="talentCards" class="talent-grid"></div>`;filterTalent()}
function filterTalent(){let q=(document.getElementById('search')?.value||'').toLowerCase(), type=document.getElementById('typeFilter')?.value||'', sort=document.getElementById('sort')?.value||'score';let list=people.filter(p=>!type||p.type===type).filter(p=>[p.name,p.station,p.role,p.market].join(' ').toLowerCase().includes(q));list.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):sort==='recent'?b.date.localeCompare(a.date):avg(b)-avg(a));document.getElementById('talentCards').innerHTML=list.map(p=>`<article class="talent-card"><div class="card-top"><div class="large-avatar">${initials(p.name)}</div><span class="tag ${p.type==='Candidate'?'candidate':''}">${p.type==='Candidate'?'Candidate':'Current talent'}</span></div><h3>${esc(p.name)}</h3><p>${esc(p.role)} · ${esc(p.station)}</p><div class="card-score"><b>${avg(p).toFixed(1)}</b><span>/ 10 · ${rating(avg(p))}</span></div><div class="meter"><div class="fill" style="width:${avg(p)*10}%"></div></div><div class="card-foot"><span>Assessed ${new Date(p.date+'T12:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}</span><button class="textbtn" onclick="editPerson('${p.id}')">Open →</button></div></article>`).join('')||'<div class="empty"><b>No matching talent</b>Try changing your search or filters.</div>'}
function newEvaluation(){editing={id:'',name:'',station:'',role:'',type:'Current talent',market:'',assessor:document.getElementById('accountName').textContent,date:new Date().toISOString().slice(0,10),scores:Array(attrs.length).fill(5),strengths:'',weaknesses:'',plan:'',recommendation:'Maybe'};renderScorecard(editing);show('scorecard')}
function editPerson(id){editing=structuredClone(people.find(p=>p.id===id));renderScorecard(editing);show('scorecard')}
function renderScorecard(p){document.getElementById('scorecard').innerHTML=`<form onsubmit="savePerson(event)"><div class="panel"><div class="panel-head"><h2>Profile details</h2><span class="tag ${p.type==='Candidate'?'candidate':''}">${p.id?'Editing saved evaluation':'Draft evaluation'}</span></div><div class="panel-body"><div class="form-layout"><div class="field"><label>Full name *</label><input required name="name" value="${esc(p.name)}" placeholder="e.g. Jordan Lee" /></div><div class="field"><label>Talent type</label><select name="type"><option ${p.type==='Current talent'?'selected':''}>Current talent</option><option ${p.type==='Candidate'?'selected':''}>Candidate</option></select></div><div class="field"><label>Station / previous station</label><input name="station" value="${esc(p.station)}" placeholder="e.g. Signal 101.3" /></div><div class="field"><label>Role</label><input name="role" value="${esc(p.role)}" placeholder="e.g. Drive Host" /></div><div class="field"><label>Market</label><input name="market" value="${esc(p.market)}" placeholder="e.g. Sydney" /></div><div class="field"><label>Assessor</label><input name="assessor" value="${esc(p.assessor)}" /></div><div class="field"><label>Assessment date</label><input name="date" type="date" value="${p.date}" /></div></div></div></div><div class="panel"><div class="panel-head"><h2>Performance scorecard</h2><button type="button" class="btn soft no-print" onclick="resetScores()">Reset to 5</button></div><div class="panel-body"><div class="score-summary"><div><small>Total score</small><b id="totalScore">${total(p)} <span style="font-size:12px;color:#527261">/ 290</span></b></div><div><small>Average rating</small><b id="averageScore">${avg(p).toFixed(1)} <span style="font-size:12px;color:#527261">/ 10</span></b></div><div><small>Rating</small><b id="ratingScore" style="font-size:16px">${rating(avg(p))}</b></div></div><div class="score-grid">${attrs.map((a,i)=>`<div class="score-row"><label for="score${i}">${i+1}. ${a}</label><input id="score${i}" class="score-input" name="score${i}" type="number" min="1" max="10" value="${p.scores[i]}" oninput="updateSummary()" /></div>`).join('')}</div></div></div><div class="panel"><div class="panel-head"><h2>Assessment notes & recommendation</h2></div><div class="panel-body"><div class="form-layout"><div class="field"><label>Key strengths</label><textarea name="strengths" placeholder="What makes this talent stand out?">${esc(p.strengths)}</textarea></div><div class="field"><label>Development opportunities</label><textarea name="weaknesses" placeholder="Where would coaching make the biggest difference?">${esc(p.weaknesses)}</textarea></div><div class="field wide"><label>Development plan</label><textarea name="plan" placeholder="Practical coaching focus, goals or next steps">${esc(p.plan)}</textarea></div><div class="field wide"><label>Hiring / talent recommendation</label><div class="recommend">${['Strong Yes','Yes','Maybe','No'].map(r=>`<label><input type="radio" name="recommendation" value="${r}" ${p.recommendation===r?'checked':''}/> ${r}</label>`).join('')}</div></div></div></div></div><div class="actions" style="justify-content:flex-end"><button type="button" class="btn soft" onclick="show('talent')">Cancel</button>${p.id?`<button type="button" class="btn danger" onclick="deletePerson('${p.id}')">Delete</button>`:''}<button type="submit" class="btn primary">Save evaluation</button></div></form>`}
function updateSummary(){let sc=attrs.map((_,i)=>Math.max(1,Math.min(10,Number(document.getElementById('score'+i).value)||1))),t=sc.reduce((a,b)=>a+b,0),a=t/attrs.length;document.getElementById('totalScore').innerHTML=`${t} <span style="font-size:12px;color:#527261">/ 290</span>`;document.getElementById('averageScore').innerHTML=`${a.toFixed(1)} <span style="font-size:12px;color:#527261">/ 10</span>`;document.getElementById('ratingScore').textContent=rating(a)}
function resetScores(){attrs.forEach((_,i)=>document.getElementById('score'+i).value=5);updateSummary()}
function savePerson(e){e.preventDefault();let f=new FormData(e.target), p={...editing};['name','station','role','type','market','assessor','date','strengths','weaknesses','plan','recommendation'].forEach(k=>p[k]=f.get(k)||'');p.scores=attrs.map((_,i)=>Math.max(1,Math.min(10,Number(f.get('score'+i))||1)));if(!p.id)p.id=String(Date.now());let i=people.findIndex(x=>x.id===p.id);if(i>=0)people[i]=p;else people.push(p);editing=structuredClone(p);save();renderAll();show('talent')}
function deletePerson(id){if(confirm('Delete this evaluation? This cannot be undone.')){people=people.filter(x=>x.id!==id);save();editing=null;renderAll();show('talent')}}
function renderCompare(){if(!comparison.length)comparison=people.slice(0,Math.min(3,people.length)).map(p=>p.id);let selected=people.filter(p=>comparison.includes(p.id));document.getElementById('compare').innerHTML=`<div class="panel"><div class="panel-head"><h2>Select up to six people</h2><span style="font-size:12px;color:var(--muted)">${selected.length} selected</span></div><div class="panel-body"><div class="compare-picks">${people.map(p=>`<button class="pick ${comparison.includes(p.id)?'selected':''}" onclick="toggleCompare('${p.id}')">${initials(p.name)} · ${esc(p.name)}</button>`).join('')||'No talent yet.'}</div></div></div>${selected.length?`<div class="compare-grid"><div class="panel"><div class="panel-head"><h2>Performance profiles</h2><button class="btn soft no-print" onclick="window.print()">Save PDF</button></div><div class="canvas-wrap"><canvas id="radar" width="430" height="370"></canvas></div></div><div class="panel compare-table"><div class="panel-head"><h2>Attribute comparison</h2></div><div class="panel-body" style="padding:4px 16px 16px"><table><thead><tr><th>Attribute</th>${selected.map(p=>`<th>${esc(p.name.split(' ')[0])}</th>`).join('')}</tr></thead><tbody><tr><td><b>Overall average</b></td>${selected.map(p=>`<td class="${avg(p)===Math.max(...selected.map(avg))?'win':''}"><b>${avg(p).toFixed(1)}</b></td>`).join('')}</tr>${attrs.map((a,i)=>{let m=Math.max(...selected.map(p=>p.scores[i]));return `<tr><td>${a}</td>${selected.map(p=>`<td class="${p.scores[i]===m?'win':''}">${p.scores[i]}</td>`).join('')}</tr>`}).join('')}</tbody></table></div></div></div>`:'<div class="empty"><b>Select talent to compare</b>Choose at least one person above.</div>'}`;if(selected.length)drawRadar(selected)}
function toggleCompare(id){if(comparison.includes(id))comparison=comparison.filter(x=>x!==id);else if(comparison.length<6)comparison.push(id);renderCompare()}
function drawRadar(ps){let c=document.getElementById('radar'),x=c.getContext('2d'),w=c.width,h=c.height,cx=w/2,cy=h/2,r=132,n=attrs.length,colors=['#006d5b','#e6a93e','#8d5cce','#dd6475','#3685ce','#9b7b35'];x.clearRect(0,0,w,h);x.font='10px system-ui';x.textAlign='center';for(let level=1;level<=5;level++){x.beginPath();for(let i=0;i<n;i++){let a=-Math.PI/2+i*2*Math.PI/n,rr=r*level/5;i?x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr):x.moveTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.closePath();x.strokeStyle='#dfe8e1';x.stroke()}for(let i=0;i<n;i++){let a=-Math.PI/2+i*2*Math.PI/n;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);x.strokeStyle='#e6ece7';x.stroke();if(i%2===0){let tx=cx+Math.cos(a)*(r+19),ty=cy+Math.sin(a)*(r+19);x.fillStyle='#718078';x.fillText((i+1),tx,ty+3)}}ps.forEach((p,j)=>{x.beginPath();p.scores.forEach((v,i)=>{let a=-Math.PI/2+i*2*Math.PI/n,rr=r*v/10;i?x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr):x.moveTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)});x.closePath();x.fillStyle=colors[j]+'22';x.fill();x.strokeStyle=colors[j];x.lineWidth=2;x.stroke()});ps.forEach((p,j)=>{x.fillStyle=colors[j];x.fillRect(22,335+j*15,10,10);x.fillStyle='#34463d';x.textAlign='left';x.fillText(p.name,38,344+j*15)});}
function exportCsv(){let header=['Name','Type','Station','Role','Market','Assessor','Date','Total','Average','Rating','Recommendation',...attrs,'Strengths','Development opportunities','Development plan'];let rows=people.map(p=>[p.name,p.type,p.station,p.role,p.market,p.assessor,p.date,total(p),avg(p).toFixed(2),rating(avg(p)),p.recommendation,...p.scores,p.strengths,p.weaknesses,p.plan]);let csv=[header,...rows].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='talent-attribute-evaluations.csv';a.click();URL.revokeObjectURL(a.href)}
</script>
<style>
  .project-hero{min-height:330px;display:grid;place-items:center;text-align:center;padding:36px 20px;background:linear-gradient(135deg,#f5fbf6,#e6f2e9);border:1px solid #d3e5d8;border-radius:16px;margin-bottom:20px}.project-hero-inner{max-width:590px}.project-hero h2{font-size:37px;letter-spacing:-1.8px;margin:7px 0}.project-hero .sub{font-size:13px;color:#6c7d74;margin:0 0 26px}.project-box{display:flex;gap:8px;justify-content:center}.project-box input{width:min(340px,65vw);padding:12px;border:1px solid #bfd2c4;border-radius:8px;background:#fff;outline-color:var(--brand)}.project-history{margin-top:15px;font-size:12px;color:#617168}.project-history select{margin-left:7px;border:1px solid #d0ded4;border-radius:6px;padding:6px;background:#fff;max-width:230px}.project-credit{font-size:10px;color:#91a198;margin:29px 0 0}.directory-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.directory-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:14px;background:#fff}.directory-row .directory-name{flex:1;min-width:0}.directory-row b{display:block;font-size:14px}.directory-row small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.directory-score{text-align:right;font-weight:800;font-size:16px}.directory-score small{font-weight:500}.empty-directory{grid-column:1/-1;padding:48px 15px;text-align:center;color:var(--muted);border:1px dashed #cbd9cf;border-radius:12px}.empty-directory b{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}.score-row{grid-template-columns:1fr 60px}.score-input{width:60px!important}@media(max-width:700px){.directory-list{grid-template-columns:1fr}.project-hero h2{font-size:28px}.project-box{flex-direction:column}.project-box input{width:100%}}
</style>
<script>
/* Project-based workspace redesign */
var projectBooks=JSON.parse(localStorage.getItem('talent-attribute-projects')||'{}');
var currentProject=localStorage.getItem('talent-attribute-current-project')||'';
people=currentProject&&projectBooks[currentProject]?projectBooks[currentProject]:[];
function validScores(p){return p.scores.filter(v=>Number(v)>0)}
function rating(a){return a===0?'Not rated':a>=9?'Elite talent':a>=8?'Excellent':a>=7?'Strong':a>=6?'Solid':a>=5?'Development required':'Not recommended'}
function save(){if(!currentProject)return;projectBooks[currentProject]=people;localStorage.setItem('talent-attribute-projects',JSON.stringify(projectBooks));localStorage.setItem('talent-attribute-current-project',currentProject)}
function projectOptions(){return Object.keys(projectBooks).sort((a,b)=>a.localeCompare(b)).map(n=>`<option value="${esc(n)}" ${n===currentProject?'selected':''}>${esc(n)}</option>`).join('')}
function openProject(){let field=document.getElementById('projectName'),name=(field?.value||'').trim();if(!name){field?.focus();return}currentProject=name;people=projectBooks[name]||[];comparison=[];save();editing=null;renderAll();show('dashboard')}
function switchProject(name){if(!name)return;currentProject=name;people=projectBooks[name]||[];comparison=[];localStorage.setItem('talent-attribute-current-project',name);editing=null;renderAll();show('dashboard')}
function show(id){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===id));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===id));let titles={dashboard:'Projects',talent:'Talent Directory',scorecard:editing?'Edit Evaluation':'New Evaluation',compare:'Compare Talent'};document.getElementById('pageTitle').textContent=titles[id];document.getElementById('crumb').textContent=id==='scorecard'?'Evaluation workspace':'On-Air Talent Evaluation Scorecard';if(id==='compare')renderCompare();window.scrollTo({top:0,behavior:'smooth'})}
function renderDashboard(){let ranked=[...people].sort((a,b)=>avg(b)-avg(a)),top=ranked[0],count=people.length,overall=count?people.reduce((s,p)=>s+avg(p),0)/count:0;document.getElementById('dashboard').innerHTML=`<div class="project-hero"><div class="project-hero-inner"><div class="eyebrow">On-Air Talent Evaluation Scorecard</div><h2>TALENT ATTRIBUTES</h2><p class="sub">Assess, compare and develop on-air talent with a disciplined, consistent scorecard.</p><div class="project-box"><input id="projectName" value="${esc(currentProject)}" placeholder="Project name" aria-label="Project name"/><button class="btn primary" onclick="openProject()">Open project</button></div><div class="project-history">${Object.keys(projectBooks).length?`Return to: <select onchange="switchProject(this.value)"><option value="">Saved projects</option>${projectOptions()}</select>`:'Enter a project name to begin.'}</div><p class="project-credit">Created by Tony Bell · Former CEO, Southern Cross Broadcasting</p></div></div>${currentProject?`<div class="stat-grid"><div class="stat"><div class="label">Project</div><div class="num" style="font-size:22px">${esc(currentProject)}</div><div class="sub">Current evaluation workspace</div></div><div class="stat"><div class="label">People assessed</div><div class="num">${count}</div><div class="sub">Profiles in this project</div></div><div class="stat"><div class="label">Average talent score</div><div class="num">${overall?overall.toFixed(1):'—'}</div><div class="sub">Zero values are not included</div></div><div class="stat"><div class="label">Top performer</div><div class="num" style="font-size:22px">${top?esc(top.name):'—'}</div><div class="sub">${top?avg(top).toFixed(1)+' / 10':'No completed evaluations'}</div></div></div>`:''}`}
function renderTalent(){let title=currentProject?`People assessed in ${esc(currentProject)}`:'Choose a project first';document.getElementById('talent').innerHTML=`<div class="panel"><div class="panel-head"><h2>${title}</h2><button class="btn primary" onclick="newEvaluation()">+ Add person</button></div><div class="panel-body"><div class="toolbar"><input class="search" id="search" oninput="filterTalent()" placeholder="Search names"/><select id="sort" class="select" onchange="filterTalent()"><option value="name">Sort: Name</option><option value="score">Sort: Overall score</option><option value="recent">Sort: Most recent</option></select></div><div id="talentCards" class="directory-list"></div></div></div>`;filterTalent()}
function filterTalent(){let area=document.getElementById('talentCards');if(!area)return;let q=(document.getElementById('search')?.value||'').toLowerCase(),sort=document.getElementById('sort')?.value||'name',list=people.filter(p=>[p.name,p.station,p.role,p.market].join(' ').toLowerCase().includes(q));list.sort((a,b)=>sort==='score'?avg(b)-avg(a):sort==='recent'?(b.date||'').localeCompare(a.date||''):a.name.localeCompare(b.name));area.innerHTML=list.map(p=>`<article class="directory-row"><div class="large-avatar">${initials(p.name||'?')}</div><div class="directory-name"><b>${esc(p.name||'Unnamed person')}</b><small>${esc([p.role,p.station,p.market].filter(Boolean).join(' · ')||'Profile details not yet entered')}</small></div><div class="directory-score">${avg(p)?avg(p).toFixed(1):'—'}<small> / 10</small></div><button class="textbtn" onclick="editPerson('${p.id}')">Open →</button></article>`).join('')||`<div class="empty-directory"><b>${currentProject?'No people added yet':'No project selected'}</b>${currentProject?'Select “Add person” to begin an assessment.':'Enter a project name on the Talent Attributes page first.'}</div>`}
function newEvaluation(){if(!currentProject){show('dashboard');document.getElementById('projectName')?.focus();return}editing={id:'',name:'',station:'',role:'',type:'',market:'',assessor:'',date:'',scores:Array(attrs.length).fill(0),strengths:'',weaknesses:'',plan:'',recommendation:''};renderScorecard(editing);show('scorecard')}
function renderScorecard(p){let valid=validScores(p),maximum=valid.length*10;document.getElementById('scorecard').innerHTML=`<form onsubmit="savePerson(event)"><div class="panel"><div class="panel-head"><h2>Profile details</h2><span class="tag">${currentProject?esc(currentProject):'No project selected'}</span></div><div class="panel-body"><div class="form-layout"><div class="field"><label>Full name *</label><input required name="name" value="${esc(p.name)}" /></div><div class="field"><label>Talent type</label><select name="type"><option value="" ${!p.type?'selected':''}></option><option ${p.type==='Current talent'?'selected':''}>Current talent</option><option ${p.type==='Candidate'?'selected':''}>Candidate</option></select></div><div class="field"><label>Station / previous station</label><input name="station" value="${esc(p.station)}" /></div><div class="field"><label>Role</label><input name="role" value="${esc(p.role)}" /></div><div class="field"><label>Market</label><input name="market" value="${esc(p.market)}" /></div><div class="field"><label>Evaluator</label><input name="assessor" value="${esc(p.assessor)}" /></div><div class="field"><label>Assessment date</label><input name="date" type="date" value="${p.date}" /></div></div></div></div><div class="panel"><div class="panel-head"><h2>Performance scorecard</h2><button type="button" class="btn soft no-print" onclick="resetScores()">Reset to 0</button></div><div class="panel-body"><div class="notice" style="margin-bottom:18px">Enter 1–10 for applicable attributes. Leave an attribute at 0 when it is not applicable; it will not be included in the average.</div><div class="score-summary"><div><small>Total score</small><b id="totalScore">${total(p)} <span style="font-size:12px;color:#527261">/ ${maximum}</span></b></div><div><small>Average rating</small><b id="averageScore">${valid.length?avg(p).toFixed(1):'—'} <span style="font-size:12px;color:#527261">/ 10</span></b></div><div><small>Rating</small><b id="ratingScore" style="font-size:16px">${rating(avg(p))}</b></div></div><div class="score-grid">${attrs.map((a,i)=>`<div class="score-row"><label for="score${i}">${i+1}. ${a}</label><input id="score${i}" class="score-input" name="score${i}" type="number" min="0" max="10" value="${p.scores[i]}" oninput="updateSummary()" /></div>`).join('')}</div></div></div><div class="panel"><div class="panel-head"><h2>Assessment notes & recommendation</h2></div><div class="panel-body"><div class="form-layout"><div class="field"><label>Key strengths</label><textarea name="strengths">${esc(p.strengths)}</textarea></div><div class="field"><label>Development opportunities</label><textarea name="weaknesses">${esc(p.weaknesses)}</textarea></div><div class="field wide"><label>Development plan</label><textarea name="plan">${esc(p.plan)}</textarea></div><div class="field wide"><label>Recommendation</label><div class="recommend">${['Strong Yes','Yes','Maybe','No'].map(r=>`<label><input type="radio" name="recommendation" value="${r}" ${p.recommendation===r?'checked':''}/> ${r}</label>`).join('')}</div></div></div></div></div><div class="actions" style="justify-content:flex-end"><button type="button" class="btn soft" onclick="show('talent')">Cancel</button>${p.id?`<button type="button" class="btn danger" onclick="deletePerson('${p.id}')">Delete</button>`:''}<button type="submit" class="btn primary">Save evaluation</button></div></form>`}
function updateSummary(){let sc=attrs.map((_,i)=>Math.max(0,Math.min(10,Number(document.getElementById('score'+i).value)||0))),valid=sc.filter(v=>v>0),t=valid.reduce((a,b)=>a+b,0),a=valid.length?t/valid.length:0;document.getElementById('totalScore').innerHTML=`${t} <span style="font-size:12px;color:#527261">/ ${valid.length*10}</span>`;document.getElementById('averageScore').innerHTML=`${valid.length?a.toFixed(1):'—'} <span style="font-size:12px;color:#527261">/ 10</span>`;document.getElementById('ratingScore').textContent=rating(a)}
function resetScores(){attrs.forEach((_,i)=>document.getElementById('score'+i).value=0);updateSummary()}
function renderCompare(){if(!currentProject){document.getElementById('compare').innerHTML='<div class="empty"><b>No project selected</b>Enter a project name on the Talent Attributes page first.</div>';return}if(!comparison.length)comparison=people.slice(0,Math.min(6,people.length)).map(p=>p.id);let selected=people.filter(p=>comparison.includes(p.id));document.getElementById('compare').innerHTML=`<div class="panel"><div class="panel-head"><h2>Select up to six people</h2><span style="font-size:12px;color:var(--muted)">${selected.length} selected</span></div><div class="panel-body"><div class="compare-picks">${people.map(p=>`<button class="pick ${comparison.includes(p.id)?'selected':''}" onclick="toggleCompare('${p.id}')">${initials(p.name||'?')} · ${esc(p.name||'Unnamed person')}</button>`).join('')||'No people added to this project yet.'}</div></div></div>${selected.length?`<div class="panel compare-table"><div class="panel-head"><h2>Attribute comparison</h2><button class="btn soft no-print" onclick="window.print()">Save PDF</button></div><div class="panel-body" style="padding:4px 16px 16px"><table><thead><tr><th>Attribute</th>${selected.map(p=>`<th>${esc((p.name||'Unnamed').split(' ')[0])}</th>`).join('')}</tr></thead><tbody><tr><td><b>Overall average</b></td>${selected.map(p=>`<td class="${avg(p)===Math.max(...selected.map(avg))&&avg(p)>0?'win':''}"><b>${avg(p)?avg(p).toFixed(1):'—'}</b></td>`).join('')}</tr>${attrs.map((a,i)=>{let m=Math.max(...selected.map(p=>p.scores[i]));return `<tr><td>${a}</td>${selected.map(p=>`<td class="${p.scores[i]===m&&m>0?'win':''}">${p.scores[i]||'—'}</td>`).join('')}</tr>`}).join('')}</tbody></table></div></div>`:'<div class="empty"><b>Select people to compare</b>Choose at least one person above.</div>'}`}
document.querySelector('.nav button[data-view="dashboard"]').innerHTML='<span class="icon">◫</span> Talent Attributes';document.querySelector('.logo').innerHTML='<span class="logo-mark">T</span>';document.querySelector('.side-subtitle')?.remove();document.querySelector('.account')?.remove();renderAll();show('dashboard');
</script>
